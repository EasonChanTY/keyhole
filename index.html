<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="齿口">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0705">
<title>齿口 · Keyhole</title>
<style>
:root{--gold:#e6c47f;--ink:#efe6d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0705;color:var(--ink);
font-family:-apple-system,"PingFang SC",system-ui,sans-serif;-webkit-user-select:none;
user-select:none;touch-action:none;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.55;transition:.45s;
background:radial-gradient(circle at 50% 46%,#0000 30%,#00000055 55%,#000000e8 82%)}
#vig.on{opacity:1}
#fade{position:fixed;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none;transition:.3s}
#fade.on{opacity:1;pointer-events:auto}
#flash{position:fixed;inset:0;z-index:8;pointer-events:none;background:#fff;opacity:0;transition:.16s}
#boot{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:18px;background:#070504;transition:.5s;color:var(--gold)}
#boot.off{opacity:0;pointer-events:none}
#boot .b1{font-size:15px;letter-spacing:.6em;text-indent:.6em;opacity:.85}
#boot .bar{width:90px;height:1px;background:#ffffff18;overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;background:var(--gold);animation:sl 1.1s infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
#hud{position:fixed;top:0;left:0;right:0;z-index:6;pointer-events:none;
padding:calc(12px + env(safe-area-inset-top)) 16px 20px;
background:linear-gradient(#000000d9,#0000);display:flex;flex-direction:column;gap:7px}
#hud .h1{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.12em;color:#8f8270}
#hud .h1 b{color:var(--gold);font-size:18px;font-weight:700;letter-spacing:0;margin-left:5px}
#hud .sp{flex:1}
#hud .h2{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#7d7266}
#hud button{pointer-events:auto;padding:7px 11px;border-radius:10px;border:1px solid #ffffff1c;
background:#ffffff08;color:#a99c88;font-size:11.5px;font-family:inherit;flex:0 0 auto}
#btnEra{background:none!important;border:none!important;padding:2px 0!important;
color:#8f8270!important;font-size:10.5px!important;text-decoration:underline;
text-decoration-color:#ffffff26;text-underline-offset:3px}
.oildot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#e6c47f;margin-right:3px}
.oildot.off{background:#3a322a}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:6;
padding:14px 16px calc(14px + env(safe-area-inset-bottom));
display:flex;flex-direction:column;gap:8px;background:linear-gradient(#0000,#000000eb 46%)}
.row{display:flex;gap:8px}
button{font-family:inherit;flex:1;padding:15px 6px;border-radius:14px;border:1px solid #ffffff1a;
background:#171210e0;color:var(--ink);font-size:15px;font-weight:600;transition:.12s}
button:active{transform:scale(.972)}
button:disabled{opacity:.26}
button.gold{background:linear-gradient(#eccd85,#a8853c);color:#1c1206;border-color:#f6e2b4}
button.small{font-size:12.5px;padding:11px}
button.danger{background:#2a1411;color:#e2a390;border-color:#c0563a55;font-size:12.5px;padding:11px}
#btnR,#btnC{display:none}
#msg{text-align:center;font-size:12.5px;line-height:1.5;color:#a2957f;min-height:18px;
text-shadow:0 0 4px #000,0 0 10px #000}
#peekBar{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:7;background:#ffffff12;display:none}
#peekBar i{display:block;height:100%;width:100%;transform-origin:left;
background:linear-gradient(90deg,#e6c47f,#fff6dd)}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.94);z-index:9;
padding:20px 26px;border-radius:20px;text-align:center;background:#0b0806f7;
border:1px solid #ffffff1f;box-shadow:0 26px 80px #000d;opacity:0;transition:.26s;
pointer-events:none;font-size:13px;line-height:1.65;color:#c0b4a0;white-space:nowrap;
text-shadow:0 0 4px #000,0 0 10px #000}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast b{display:block;font-size:23px;font-weight:700;color:var(--gold);margin:4px 0}
#stage{position:fixed;inset:0;z-index:7;display:none}
#stage.on{display:block}
#tapLayer{position:absolute;inset:0}
#stTop{position:absolute;top:calc(96px + env(safe-area-inset-top));left:0;right:0;
display:flex;justify-content:space-between;padding:0 22px;font-size:11px;letter-spacing:.14em;
color:#8f8270;pointer-events:none;text-shadow:0 0 4px #000,0 0 8px #000}
#stTop b{color:var(--gold);font-size:19px;letter-spacing:0;display:block;margin-top:3px}
#rar{position:absolute;left:50%;top:55%;transform:translate(-50%,8px) scale(.9);opacity:0;
text-align:center;pointer-events:none;transition:.32s}
#rar.on{opacity:1;transform:translate(-50%,0) scale(1)}
#rar .q{font-size:11px;letter-spacing:.26em;display:inline-block;padding:4px 12px;
border-radius:20px;color:#0d0906;font-weight:800}
#rar .n{font-size:20px;margin-top:8px;letter-spacing:.08em;color:#f4ecdd;font-weight:600;
text-shadow:0 0 2px #000,0 0 5px #000,0 0 12px #000,0 1px 2px #000}
#rar .v{font-size:15px;margin-top:3px;color:#e6c47f;transition:.2s;
text-shadow:0 0 2px #000,0 0 6px #000}
#rar .v.hit{color:#ff9a86}
#markLog{display:flex;flex-direction:column;gap:3px;margin-top:6px;align-items:center}
.mk{font-size:11px;letter-spacing:.06em;color:#ff9080;text-shadow:0 0 3px #000,0 0 7px #000}
#chips{position:absolute;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));
display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:0 20px;pointer-events:none}
.chip{width:8px;height:8px;border-radius:2px}
#stHint{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));
text-align:center;font-size:12.5px;color:#b7a88e;letter-spacing:.14em;animation:bt 1.6s infinite;
pointer-events:none;text-shadow:0 0 4px #000,0 0 8px #000}
@keyframes bt{0%,100%{opacity:.45}50%{opacity:1}}
#stSum{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
justify-content:center;gap:10px;background:#0a0705e8}
#stSum.on{display:flex}
#stSum .lbl{font-size:11px;letter-spacing:.4em;color:#8f8270}
#stSum .big{font-size:46px;color:var(--gold);font-weight:200}
#stSum .sub{font-size:12px;color:#9c8f7b;margin-bottom:12px;text-align:center;line-height:1.7}
#stSum button{width:210px;padding:16px;border-radius:16px;border:none;flex:0 0 auto;
background:linear-gradient(#eccd85,#a8853c);color:#1c1206;font-size:15px;font-weight:700}
#btnNest{display:none;background:linear-gradient(#9fd7ff,#3f7fb8)!important;
color:#08202f!important;margin-top:2px}
#btnNest.on{display:block}
#tipBar{position:fixed;left:14px;right:14px;top:calc(80px + env(safe-area-inset-top));
z-index:11;padding:12px 15px;border-radius:13px;background:#0b0806f2;
border:1px solid #e6c47f33;font-size:12.5px;line-height:1.65;color:#cdbfa6;
opacity:0;transform:translateY(-8px);transition:.32s;pointer-events:none;
box-shadow:0 12px 40px #000a;text-shadow:0 0 4px #000}
#tipBar.on{opacity:1;transform:none}
.panel{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;
background:linear-gradient(#0c0906,#070504);
padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.panel.on{display:flex}
.phead{display:flex;align-items:center;gap:8px;padding-bottom:12px;
border-bottom:1px solid #ffffff12;margin-bottom:12px}
.phead h2{margin:0;font-size:15px;font-weight:500;letter-spacing:.2em;color:var(--gold)}
.phead .sp{flex:1}
.phead button{flex:0 0 auto;padding:8px 12px;font-size:12.5px;border-radius:10px;
border:1px solid #ffffff1c;background:#ffffff08;color:#a99c88}
#login{display:none;position:fixed;inset:0;z-index:30;flex-direction:column;align-items:center;
justify-content:center;overflow:hidden;
background:radial-gradient(70% 55% at 50% 38%,#2a1d12 0%,#0b0705 62%,#050302 100%)}
#login.on{display:flex}
#login .kh{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:180px;opacity:.12}
#login .kh path{fill:none;stroke:#e6c47f;stroke-width:2.2}
#login .glow{position:absolute;top:15%;left:50%;transform:translateX(-50%);width:440px;height:440px;
border-radius:50%;background:radial-gradient(circle,#e6c47f22 0%,#0000 62%)}
#login h1{position:relative;margin:0;font-size:42px;font-weight:200;color:var(--gold);
letter-spacing:.46em;text-indent:.46em;text-shadow:0 0 50px #e6c47f55}
#login .sub{position:relative;font-size:8.5px;letter-spacing:.58em;text-indent:.58em;
color:#7a6a53;margin-top:16px}
#login .rule{width:60px;height:1px;margin:28px 0 24px;
background:linear-gradient(90deg,#0000,#e6c47f88,#0000)}
#login .lgp{position:relative;font-size:12px;color:#8c7e69;text-align:center;line-height:2.1;
letter-spacing:.08em;margin-bottom:28px}
#login .lgp em{color:var(--gold);font-style:normal}
#login input{position:relative;width:236px;padding:15px 16px;border-radius:13px;
border:1px solid #ffffff20;background:#ffffff0a;color:var(--ink);font-size:15px;
text-align:center;font-family:inherit;outline:none}
#login input::placeholder{color:#5a5145}
#login #btnLogin{position:relative;margin-top:14px;width:236px;flex:0 0 auto;padding:15px;
border-radius:14px;border:none;background:linear-gradient(#eccd85,#a8853c);color:#1c1206;
font-size:15px;font-weight:700;letter-spacing:.16em}
#login .tip{position:relative;margin-top:24px;font-size:10px;color:#4f463c;text-align:center;line-height:2}
#bagList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;
flex-direction:column;gap:7px;padding-bottom:8px}
.brow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;
background:#16121099;border:1px solid #ffffff10}
.brow.picked{background:#2a2114cc;border-color:#e6c47f55}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.bn{flex:1;font-size:14px;color:#ddd2c0}
.bc{font-size:10.5px;color:#8f8270;flex:0 0 auto}
.bc.bad{color:#e98a76}
.bp{font-size:13px;color:var(--gold);width:62px;text-align:right;flex:0 0 auto}
.star{color:#ffcf5c;font-size:11px;width:12px;flex:0 0 auto}
.ck{width:16px;height:16px;border-radius:5px;border:1px solid #ffffff30;flex:0 0 auto;
display:flex;align-items:center;justify-content:center;font-size:10px;color:#1c1206}
.brow.picked .ck{background:#e6c47f;border-color:#e6c47f}
#bulkBar{display:none;gap:8px;align-items:center;padding-top:10px;border-top:1px solid #ffffff12}
#bulkBar.on{display:flex}
#bulkInfo{font-size:11.5px;color:#a2957f;flex:1}
#bulkBar button{flex:0 0 auto;padding:12px 14px;font-size:13px}
#detail{position:fixed;inset:0;z-index:32;display:none;align-items:flex-end;background:#000000c4}
#detail.on{display:flex}
#detail .card{width:100%;background:#100c09;border-radius:22px 22px 0 0;
padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid #ffffff1a;
animation:up .28s;max-height:86%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#detail .dn{font-size:19px;color:#efe4d0;letter-spacing:.06em}
#detail .dt{font-size:10.5px;color:#7a6a53;margin-top:5px;letter-spacing:.14em}
#detail .dd{font-size:12.5px;color:#a89a86;line-height:1.85;margin:13px 0 4px;font-style:italic}
#dChart{width:100%;height:92px;display:block;margin:10px 0 2px;touch-action:none;
border-radius:8px;background:#ffffff05}
.chartMeta{display:flex;justify-content:space-between;font-size:10px;color:#6f6558;margin-bottom:4px}
.chartMeta b{color:#a2957f;font-weight:600}
.chartTip{font-size:9.5px;color:#4f463c;text-align:center;margin-bottom:10px}
#detail .dprice{font-size:26px;color:var(--gold);font-weight:200;display:flex;
align-items:baseline;gap:8px;margin-top:4px}
#detail .dprice small{font-size:10.5px;color:#7a6a53;letter-spacing:.1em}
#detail .drow{display:flex;gap:9px;margin-top:16px}
#setList{display:flex;flex-direction:column;gap:10px}
#setList .lab{font-size:11px;color:#7d7266;letter-spacing:.16em;margin:6px 0 2px}
.mrow{display:flex;gap:8px}
.mrow button{flex:1;padding:13px;font-size:13.5px;border-radius:12px;border:1px solid #ffffff1a;
background:#171210;color:#a2957f}
.mrow button.on{background:linear-gradient(#eccd85,#a8853c);color:#1c1206;border-color:#f6e2b4}
#eraScreen .ename{font-size:27px;color:var(--gold);font-weight:200;letter-spacing:.2em;margin:4px 0 6px}
#eraScreen .edesc{font-size:12px;color:#8c7e69;line-height:1.9;margin-bottom:16px}
.catrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;
background:#16121099;border:1px solid #ffffff0c;margin-bottom:7px}
.catrow .cn{width:42px;font-size:13px;color:#ddd2c0}
.catrow .cb{flex:1;height:4px;border-radius:2px;background:#ffffff12;overflow:hidden}
.catrow .cb i{display:block;height:100%;background:var(--gold)}
.catrow .cv{width:58px;text-align:right;font-size:12px;color:#a2957f}
.catrow .cv.up{color:#8ef2a8}
.catrow .cv.dn{color:#ff9a86}
#esTop{margin:18px 0 8px;font-size:11px;color:#7d7266;letter-spacing:.14em}
.toprow{display:flex;justify-content:space-between;font-size:12.5px;color:#b7a88e;padding:7px 2px;
border-bottom:1px solid #ffffff08}
.toprow b{color:var(--gold)}
#esBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#freeBtn{position:fixed;left:14px;bottom:calc(158px + env(safe-area-inset-bottom));
z-index:8;display:flex;align-items:center;gap:7px;padding:10px 15px;border-radius:100px;
background:#14200ff0;border:1px solid #7fc47a55;color:#cfe0c2;font-size:12px;
font-family:-apple-system,"PingFang SC";font-weight:600;box-shadow:0 8px 24px #000a;transition:.22s}
#freeBtn:active{transform:scale(.96)}
#freeBtn.hide{opacity:0;pointer-events:none;transform:translateY(8px)}
#freeBtn.ready{background:linear-gradient(#9ee08a,#4f8f45);color:#0d2008;border-color:#c6f0b8}
#freeBtn small{font-weight:400;font-size:10px;opacity:.75;margin-left:2px}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vig"></div>
<div id="flash"></div>

<header id="hud">
  <div class="h1">
    <div>金币<b id="hCoins">260</b></div>
    <div class="sp"></div>
    <button id="btnBag">背包 <span id="bagCount">0</span></button>
    <button id="btnSet">⚙</button>
  </div>
  <div class="h2">
    <span id="hOil"></span>
    <button id="btnEra">时代</button>
    <span class="sp"></span>
    <span id="hLeft"></span>
  </div>
</header>

<section id="ui">
  <div id="msg">点开一只箱子</div>
  <div class="row">
    <button id="btnA" class="small">…</button>
    <button id="btnR" class="small">重看这把 · 60 金</button>
  </div>
  <button id="btnB" class="gold">…</button>
  <button id="btnC" class="danger">暴力开</button>
</section>

<div id="peekBar"><i></i></div>
<div id="toast"></div>
<div id="tipBar"></div>

<section id="stage">
  <div id="tapLayer"></div>
  <div id="stTop">
    <div>本箱估价<b id="stSumVal">0</b></div>
    <div style="text-align:right">第<b id="stIdx">0</b></div>
  </div>
  <div id="rar"><div class="q"></div><div class="n"></div><div class="v"></div><div id="markLog"></div></div>
  <div id="chips"></div>
  <div id="stHint">转 动 查 看</div>
  <div id="stSum">
    <div class="lbl">本 箱 估 价</div>
    <div class="big" id="sumBig">0</div>
    <div class="sub" id="sumSub"></div>
    <button id="btnNest">箱中箱 · 再开一只</button>
    <button id="btnTake">收 进 背 包</button>
  </div>
</section>

<section id="login">
  <svg class="kh" viewBox="0 0 100 150"><path d="M50 18a24 24 0 1 0 0 48a24 24 0 1 0 0-48Z M36 62 L27 140 H73 L64 62 Z"/></svg>
  <div class="glow"></div>
  <h1>齿口</h1>
  <div class="sub">K E Y H O L E</div>
  <div class="rule"></div>
  <div class="lgp">有些箱子<br><em>只值得被打开一次</em></div>
  <input id="nick" placeholder="你的名字" maxlength="12">
  <button id="btnLogin">进 入</button>
  <div class="tip">存档在本机 · 换设备不同步</div>
</section>

<section id="bagScreen" class="panel">
  <div class="phead"><h2>背 包</h2><div class="sp"></div>
    <button id="bsBulk">批量</button><button id="bsClose">关闭</button></div>
  <div style="display:flex;gap:9px;font-size:10.5px;color:#7d7266;margin-bottom:10px">
    <span id="bsEra"></span><span id="bsEraDesc" style="color:#544b40"></span></div>
  <div id="bagList"></div>
  <div id="bagEmpty" style="text-align:center;color:#5f5548;font-size:12.5px;padding:40px 0;display:none">背包是空的 —— 去开箱吧</div>
  <div id="bulkBar">
    <button id="bulkAll" class="small">全选</button>
    <span id="bulkInfo">0 件 · 0 金</span>
    <button id="bulkSell" class="gold">出售</button>
  </div>
</section>

<div id="detail">
  <div class="card">
    <div class="dn" id="dName">—</div>
    <div class="dt" id="dMeta">—</div>
    <div class="dd" id="dDesc"></div>
    <canvas id="dChart"></canvas>
    <div class="chartMeta"><span>最高 <b id="chHi">0</b></span><span id="chCur">拖动查看</span><span>最低 <b id="chLo">0</b></span></div>
    <div class="chartTip">← 按住图表左右滑动，看每一个小时的成交价 →</div>
    <div class="dprice" id="dPrice">0<small>当前市价</small></div>
    <div class="drow"><button id="dFav" class="small">收藏</button><button id="dSell" class="gold">出售</button></div>
  </div>
</div>

<section id="eraScreen" class="panel">
  <div class="phead"><h2>时 代</h2><div class="sp"></div><button id="esClose">关闭</button></div>
  <div id="esBody"></div>
</section>

<section id="setScreen" class="panel">
  <div class="phead"><h2>设 置</h2><div class="sp"></div><button id="stClose">关闭</button></div>
  <div id="setList">
    <div class="lab">难 度（下局生效）</div>
    <div class="mrow" id="modeRow">
      <button data-mode="easy">简单</button><button data-mode="hard">困难</button><button data-mode="nightmare">噩梦</button>
    </div>
    <div class="lab" style="margin-top:16px">新 手 提 示</div>
    <div class="mrow"><button id="btnTut">开</button></div>
    <div class="lab" style="margin-top:16px">存 档</div>
    <button id="btnReset" class="danger" style="flex:0 0 auto">清空存档、重新开始</button>
    <div style="font-size:10.5px;color:#4f463c;line-height:1.9;margin-top:20px">
      版本 v13 · 单机版<br>简单模式没有至尊／钻石／黑曜石箱，危险物也最少。</div>
  </div>
</section>

<div id="fade"></div>
<div id="boot"><div class="b1">齿 口</div><div class="bar"><i></i></div></div>

<script>
window.addEventListener('error',e=>err(e.message));
window.addEventListener('unhandledrejection',e=>err((e.reason&&e.reason.message)||e.reason));
function err(m){document.body.insertAdjacentHTML('beforeend',
 '<div style="position:fixed;inset:0;z-index:99;background:#000;color:#ff9c9c;padding:24px;font-size:12px;line-height:1.7;overflow:auto;white-space:pre-wrap">出错了：\n'+m+'</div>');}
</script>

<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';

function hash(s){let h=2166136261;
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
 return ((h>>>0)%100000)/100000;}

function eraAt(ep){const i=Math.floor(hash('era'+Math.floor(ep/4))*ERAS.length);
 return ERAS[Math.min(i,ERAS.length-1)];}
const curEra=()=>eraAt(epoch());
function priceAt(item,cond,ep){
 if(cond>=5||!item)return 0;
 const era=eraAt(ep);
 let f=.9+hash(item.id+'|'+ep)*.2;
 const r=hash(item.id+'|r|'+ep);
 if(r<.0025&&item.t>=4) f*=(8+hash(item.id+'|j|'+ep)*12);
 else if(r<.015) f*=3.4;
 else if(r<.033) f*=.35;
 return Math.max(1,Math.round(item.b*(era.m[item.c]||1)*f*COND_MUL[cond]));
}
const priceOf=(it,cd)=>priceAt(it,cd,epoch());

let AC=null;
const ac=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();return AC;};
function tone(f,d,t='sine',v=.12,to=0){
 const c=ac(),o=c.createOscillator(),g=c.createGain();
 o.type=t;o.frequency.value=f;
 if(to)o.frequency.exponentialRampToValueAtTime(to,c.currentTime+d);
 g.gain.setValueAtTime(v,c.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
 o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.03);}
function noise(d,v=.08,hp=1600){
 const c=ac(),b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate);
 const a=b.getChannelData(0);
 for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,3);
 const s=c.createBufferSource();s.buffer=b;
 const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
 const g=c.createGain();g.gain.value=v;
 s.connect(f);f.connect(g);g.connect(c.destination);s.start();}

const TIERS=[
{name:'木箱',metal:0x8a6a3a,price:18,n:[3,3],w:[.45,.32,.16,.07,0],
 swan:.03,wt:.35,hz:0},
{name:'铜箱',metal:0xb87333,price:55,n:[4,4],w:[.34,.30,.22,.12,.02],
 swan:.05,wt:.26,hz:.006},
{name:'银箱',metal:0xb9c3cc,price:130,n:[6,6],w:[.22,.30,.28,.15,.05],
 swan:.07,wt:.20,hz:.012},
{name:'金箱',metal:0xd8b25c,price:280,n:[8,8],w:[.14,.26,.28,.22,.10],
 swan:.10,wt:.12,hz:.020},
{name:'至尊箱',metal:0xf0d78a,price:650,n:[10,10],w:[.10,.20,.26,.24,.20],
 swan:.14,wt:.05,hz:.030},
{name:'钻石箱',metal:0x9fd8ff,body:0x16202e,price:1400,n:[12,12],w:[0,.08,.22,.35,.35],
 swan:.18,wt:.004,hz:.05},
{name:'黑曜石箱',metal:0x2f2f38,body:0x14141a,price:280,n:[5,5],w:[1,0,0,0,0],
 swan:.06,wt:.016,hz:.04,special:'obsidian'}
];
const FLAW_P=[0,0,.05,.14,.28,.40];
const MED={scorpion:20,sulfur:12,bomb:60};
const EVT_NAME={scorpion:'毒蝎子',sulfur:'硫磺瓶',bomb:'炸弹',oil:'灯油',nest:'箱中箱'};

function pickTier(){
 const pool=(MODE===MODES.easy)?TIERS.slice(0,4):TIERS;
 const r=Math.random();let a=0;
 for(const t of pool){a+=t.wt;if(r<a)return t;}
 return pool[0];
}
function rollCond(tier){
 if(tier<=1)return 1;
 if(Math.random()>FLAW_P[tier])return 1;
 const r=Math.random();
 if(tier>=4&&r<.14)return 5;
 if(r<.5)return 2;
 if(r<.83)return 3;
 return 4;
}
function insertEvt(out,ev){
 const i=out.length>2?1+rnd(out.length-1):out.length;
 out.splice(i,0,ev);
}
function rollLoot(tier){
 if(tier.special==='obsidian'){
  const out=[];
  const pool=['scorpion','scorpion','sulfur','sulfur','bomb','junk','junk'];
  for(let i=0;i<4;i++){
   const k=pool[rnd(pool.length)];
   if(k==='junk'){
    out.push({kind:'item',item:POOL[1][rnd(POOL[1].length)],cond:1});
   }else{
    out.push({kind:'evt',ev:k});
   }
  }
  if(Math.random()<.32){
   out.push({kind:'item',item:OBS_ITEMS[rnd(OBS_ITEMS.length)],cond:1});
  }else{
   out.push({kind:'item',item:POOL[1][rnd(POOL[1].length)],cond:1});
  }
  return out;
 }

 const n=tier.n[0]+rnd(tier.n[1]-tier.n[0]+1);
 const out=[];
 for(let i=0;i<n;i++){
  const r=Math.random();let a=0,t=1;
  for(let k=0;k<5;k++){a+=tier.w[k];if(r<a){t=k+1;break;}}
  const pool=POOL[t];
  out.push({kind:'item',item:pool[rnd(pool.length)],cond:rollCond(t)});
 }
 let pBad=MODE.haz+(tier.hz||0);
 if(S.tutorial&&MODE===MODES.easy&&S.opened<3)pBad=0;
 const pGood=(MODE===MODES.easy)?.045:((MODE===MODES.hard)?.055:.065);
 const r=Math.random();
 if(r<pBad){
  const x=Math.random();
  insertEvt(out,{kind:'evt',ev:(x<.28?'bomb':(x<.64?'scorpion':'sulfur'))});
 }else if(r<pBad+pGood){
  insertEvt(out,{kind:'evt',ev:(Math.random()<.82?'oil':'nest')});
 }
 return out;
}
function clearGroup(root){
 while(root.children.length){
  const c=root.children[0];root.remove(c);
  c.traverse(o=>{if(o.geometry)o.geometry.dispose();});
 }
}

/* ===== 回合 ===== */
function newRound(){
 clearGroup(boxRoot);
 S.boxes=[];
 for(let i=0;i<CFG.boxCount;i++){
  const tier=pickTier();
  const loot=rollLoot(tier);
  const shown=loot.filter(x=>x.kind==='item')
   .sort((a,b)=>b.item.t-a.item.t).slice(0,2);
  const g=makeBox(tier,shown);
  g.position.set(0,1.46-i*.73,0);
  boxRoot.add(g);
  g.traverse(o=>o.userData.boxIndex=i);
  S.boxes.push({tier,loot,shown,g,swan:Math.random()<tier.swan});
 }
 S.selBox=-1;S.selKey=-1;S.busy=false;
 S.phase='box';S.peeking=false;S.peeked=false;
 S.loot=[];S.drawIdx=-1;S.collected=0;S.gotCount=0;
 S.summary=false;S.insp=null;S.obs=[];S.exploded=false;S.hasNest=false;
 vig.classList.remove('on');
 peekBar.style.display='none';
 stageEl.classList.remove('on');
 uiEl.style.display='flex';
 pins.forEach(p=>p.visible=false);
 datum.visible=false;
 obClear();
 layout();
 msg(MODE.name+'模式 · '+MODE.teeth+' 齿 · 点一只箱子');
 updateUI();
 showTip('box');
}
function chooseBox(i){
 if(S.phase!=='box'||S.busy)return;
 S.selBox=i;SFX.tap();haptic(8);
 const b=S.boxes[i];
 if(b.tier.special==='obsidian'){
  msg('黑曜石箱 · 一路都是危险 —— 撑到最后一格才有货');
 }else if(b.tier.name==='钻石箱'){
  msg('钻石箱 · 12 件 · 这一箱可能改变一切');
 }else{
  msg(b.tier.name+' · '+b.tier.price+'金｜玻璃下：'+
   b.shown.map(x=>x.item.n).join('、'));
 }
 updateUI();
}
function confirmBox(){
 if(S.phase!=='box'||S.selBox<0)return;
 const b=S.boxes[S.selBox];
 if(S.coins<b.tier.price){toast('金币不够买这只箱子');return;}
 S.coins-=b.tier.price;save();
 const n=MODE.teeth;
 buildPins(n);
 S.obs=[];
 if(MODE.obs>0){
  S.obs.push(OB_LIST[rnd(OB_LIST.length)]);
  if(MODE.obs>1){
   let k=OB_LIST[rnd(OB_LIST.length)],guard=0;
   while(k===S.obs[0]&&guard++<8)k=OB_LIST[rnd(OB_LIST.length)];
   S.obs.push(k);
  }
 }
 buildObstructions(S.obs);
 S.lock=Array.from({length:n},()=>rnd(5));
 S.lock.forEach((c,i)=>{
  const L=segLen(c)*.95;
  pins[i].scale.y=L;pins[i].position.y=.16-L/2;
 });
 buildKeys(b.swan,n);
 S.busy=true;updateUI();
 fadeTo(()=>{
  S.phase='lock';S.peeking=false;S.peeked=false;S.busy=false;
  const ob=S.obs.length?(' · 锁孔里塞着 '+S.obs.map(x=>OB_NAME[x]).join(' + ')):'';
  msg('看清 '+n+' 根锁芯'+ob);
  updateUI();
  showTip('lock');
 });
}
function buildKeys(blackSwan,n){
 clearGroup(keysRoot);
 const codes=[];
 if(!blackSwan)codes.push(S.lock.slice());
 while(codes.length<MODE.keys){
  const c=Array.from({length:n},()=>rnd(5));
  if(codes.some(x=>same(x,c)))continue;
  codes.push(c);
 }
 for(let i=codes.length-1;i>0;i--){
  const j=rnd(i+1);[codes[i],codes[j]]=[codes[j],codes[i]];
 }
 const cnt=codes.length;
 const sp=Math.min(.42,2.35/(cnt-1)),top=.66;
 S.keys=codes.map((code,i)=>{
  const g=makeKey(code);
  g.position.set(0,top-i*sp,0);
  keysRoot.add(g);
  const obj={g,id:i,code,teeth:g.userData.teeth,mat:g.userData.mat,
   viewed:false,revealUntil:0,dead:false};
  g.traverse(o=>o.userData.keyRef=obj);
  return obj;
 });
 S.keysCenter=top-(cnt-1)*sp/2;
 S.keysNeedH=(cnt-1)*sp+.46;
 layout();
}

function addMk(txt,color){
 const d=document.createElement('div');
 d.className='mk';
 if(color)d.style.color=color;
 d.textContent=txt;
 markLog.appendChild(d);
}
function drawItem(entry){
 if(S.insp&&S.insp.obj){
  itemHolder.remove(S.insp.obj);
  S.insp.obj.traverse(o=>{if(o.geometry)o.geometry.dispose();});
 }
 const isEvt=entry.kind==='evt';
 let obj,marks=[],it=null;
 if(isEvt){
  obj=makeEventMesh(entry.ev);
 }else{
  it=entry.item;
  obj=makeItemMesh(it.t);
  obj.traverse(o=>{if(o.isMesh&&o.material&&o.material.clone)o.material=o.material.clone();});
  if(entry.cond>1)marks.push({angle:Math.random()*Math.PI*2,found:false});
  marks.forEach(m=>{
   const holder=new THREE.Group();
   holder.rotation.y=m.angle;
   const crack=makeCrack(entry.cond);
   crack.position.set(0,.028,.049);
   holder.add(crack);
   obj.add(holder);
   m.holder=holder;m.crack=crack;
  });
 }
 obj.scale.setScalar(.001);
 itemHolder.add(obj);

 S.insp={obj,marks,entry,it,isEvt,
  cond:isEvt?1:entry.cond,
  fullPrice:isEvt?0:priceOf(it,1),
  realPrice:isEvt?0:priceOf(it,entry.cond),
  revealed:false,unlocked:isEvt,rot:0,rotTarget:0,turn:0,spin:.06,
  crumbled:false,resolved:false,t0:performance.now()};

 markLog.innerHTML='';
 const tag=rarEl.querySelector('.q');

 if(isEvt){
  const bad=(entry.ev!=='oil'&&entry.ev!=='nest');
  tag.textContent=bad?'危 险':'意 外';
  tag.style.background=bad?'#c0453a':'#4faf7a';
  rarEl.querySelector('.n').textContent=EVT_NAME[entry.ev];
  setPriceText(0,'');
  stHint.textContent='轻 点 继 续';
  SFX.pop(bad?4:5);
  haptic(bad?30:15);
  setTimeout(()=>{if(S.insp)resolveEvent(S.insp);},700);
 }else{
  flash(it.t);
  SFX.pop(it.t);
  if(it.t>=5){SFX.cheer();haptic([20,30,60]);}
  else if(it.t>=4){SFX.big();haptic([15,25,40]);}
  const c=CAT[it.c];
  tag.textContent=it.uniq?'藏 品':c.name;
  tag.style.background=it.uniq?'#e6c47f':c.css;
  rarEl.querySelector('.n').textContent=it.n;
  setPriceText(S.insp.fullPrice,'');
  stHint.textContent='转 动 查 看';
 }
 rarEl.classList.remove('on');
 void rarEl.offsetWidth;
 setTimeout(()=>rarEl.classList.add('on'),150);

 if(!isEvt){
  const chip=document.createElement('div');
  chip.className='chip';
  chip.style.background=CAT[it.c].css;
  chipsEl.appendChild(chip);
 }
 $('stIdx').textContent=S.drawIdx+1;
 refreshTotal();
}
function setPriceText(v,cls){
 const el=rarEl.querySelector('.v');
 el.textContent=v>0?('+'+v+' 金币（估价）'):((S.insp&&S.insp.isEvt)?'':'一文不值');
 el.className='v '+(cls||'');
}
function refreshTotal(){
 const cur=(S.insp&&!S.insp.isEvt&&!S.insp.crumbled)?S.insp.realPrice:0;
 $('stSumVal').textContent=S.collected+cur;
}
function sevOp(c){return c>=5?.85:(c>=4?.72:(c>=3?.58:.42));}
function revealCond(){
 const insp=S.insp;
 if(!insp||insp.revealed||insp.isEvt)return;
 insp.revealed=true;
 insp.marks.forEach(m=>{
  if(!m.crack)return;
  const mt=m.crack.userData.mat;
  let t=0;
  const f=()=>{t+=.12;mt.opacity=Math.min(sevOp(insp.cond),t);
   if(t<1)requestAnimationFrame(f);};
  f();
 });
 if(insp.cond>=2){
  insp.obj.traverse(o=>{
   if(o.isMesh&&o.material&&o.material.color){
    o.material.color.multiplyScalar(insp.cond>=4?.78:.9);
    if('roughness' in o.material)o.material.roughness=Math.min(1,o.material.roughness+.18);
   }
  });
 }
 if(insp.cond>=5){
  insp.crumbled=true;
  SFX.shard();haptic([40,30,80]);flash(5);
  insp.obj.traverse(o=>{if(o.isMesh&&o.material&&o.material.color)o.material=MAT.rubble;});
  addMk('碎 裂 了 · 0 元');
  setPriceText(0,'');
  toast('一碰就碎了<b>0 元</b>',1600);
 }else if(insp.cond===1){
  SFX.perfect();
  addMk('品相完好','#8ef2a8');
 }else{
  SFX.flaw();haptic(18);
  addMk(COND_TXT[insp.cond]+'  −'+Math.round((1-COND_MUL[insp.cond])*100)+'%');
  setPriceText(insp.realPrice,'hit');
  setTimeout(()=>setPriceText(insp.realPrice,''),420);
 }
 refreshTotal();
}

 }else if(ev==='bomb'){

function rr(ctx,x,y,w,h,r){
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);
 ctx.arcTo(x,y,x+w,y,r);
 ctx.closePath();
}
function drawChart(item,cond,cur){
 const cv=$('dChart');
 const rect=cv.getBoundingClientRect();
 if(rect.width<10)return;
 const dpr=Math.min(devicePixelRatio,2);
 cv.width=Math.round(rect.width*dpr);
 cv.height=Math.round(rect.height*dpr);
 const ctx=cv.getContext('2d');
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const W=rect.width,H=rect.height;
 ctx.clearRect(0,0,W,H);
 const N=24,ep=epoch(),pts=[];
 for(let i=N-1;i>=0;i--)pts.push(priceAt(item,cond,ep-i));
 chartCache={item,cond,pts,N};
 const mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);
 const span=Math.max(1,mx-mn);
 const padT=14,padB=18;
 const X=i=>i*(W/(N-1));
 const Y=v=>padT+(1-(v-mn)/span)*(H-padT-padB);
 ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;
 [0,.5,1].forEach(k=>{
  const yy=padT+k*(H-padT-padB);
  ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();
 });
 const grad=ctx.createLinearGradient(0,padT,0,H-padB);
 grad.addColorStop(0,'rgba(230,196,127,.28)');
 grad.addColorStop(1,'rgba(230,196,127,0)');
 ctx.beginPath();
 ctx.moveTo(X(0),Y(pts[0]));
 for(let i=1;i<N;i++)ctx.lineTo(X(i),Y(pts[i]));
 ctx.lineTo(W,H-padB);ctx.lineTo(0,H-padB);
 ctx.closePath();
 ctx.fillStyle=grad;ctx.fill();
 const up=pts[N-1]>=pts[0];
 ctx.beginPath();
 ctx.moveTo(X(0),Y(pts[0]));
 for(let i=1;i<N;i++)ctx.lineTo(X(i),Y(pts[i]));
 ctx.strokeStyle=up?'#8ef2a8':'#ff9a86';
 ctx.lineWidth=1.6;ctx.lineJoin='round';ctx.stroke();

 if(cur===undefined)cur=N-1;
 cur=Math.max(0,Math.min(N-1,cur));
 const cx=X(cur),cy=Y(pts[cur]);
 ctx.strokeStyle='#e6c47f55';ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(cx,padT-6);ctx.lineTo(cx,H-padB);ctx.stroke();
 ctx.beginPath();ctx.arc(cx,cy,4.5,0,Math.PI*2);
 ctx.fillStyle='#e6c47f';ctx.fill();
 ctx.strokeStyle='#0a0705';ctx.lineWidth=1.5;ctx.stroke();

 const label=pts[cur]+' 金';
 ctx.font='10px -apple-system,sans-serif';
 const tw=ctx.measureText(label).width;
 let bx=cx-tw/2-7;
 bx=Math.max(2,Math.min(W-tw-16,bx));
 ctx.fillStyle='#0b0806e8';
 rr(ctx,bx,2,tw+14,15,5);
 ctx.fill();
 ctx.fillStyle='#e6c47f';ctx.textAlign='left';
 ctx.fillText(label,bx+7,13);
 ctx.fillStyle='#5f5548';ctx.font='9px -apple-system,sans-serif';
 ctx.fillText('24 小时前',0,H-3);
 ctx.textAlign='right';ctx.fillText('现在',W,H-3);ctx.textAlign='left';

 $('chHi').textContent=mx;
 $('chLo').textContent=mn;
 $('chCur').textContent=(cur===N-1)?('现在 '+pts[cur]+' 金'):((N-1-cur)+' 小时前 '+pts[cur]+' 金');
}
const chartEl=$('dChart');
function chartAt(e){
 if(!chartCache)return;
 const r=chartEl.getBoundingClientRect();
 const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
 drawChart(chartCache.item,chartCache.cond,Math.round(x*(chartCache.N-1)));
}

const hudEl=document.getElementById('hud');
function frameCam(cam,centerY,needH,needW,tIn,bIn){
 const W=innerWidth,H=innerHeight;
 const top=tIn!==undefined?tIn:Math.max(0,hudEl.getBoundingClientRect().bottom-6);
 const bottom=bIn!==undefined?bIn:Math.max(0,H-uiEl.getBoundingClientRect().top+6);
 const availH=Math.max(160,H-top-bottom);
 const tv=Math.tan(cam.fov*Math.PI/360);
 const dV=(needH/2)/(tv*availH/H);
 const dH=(needW/2)/(tv*cam.aspect);
 const d=Math.max(dV,dH);
 const visibleH=2*tv*d;
 const targetPx=top+availH/2;
 const shift=(H/2-targetPx)*visibleH/H;
 const ty=centerY-shift;
 cam.position.set(0,ty,d);
 cam.lookAt(0,ty,0);
}
function layout(){
 const W=innerWidth,H=innerHeight;
 renderer.setSize(W,H,false);
 if(composer)composer.setSize(W,H);
 camB.aspect=camK.aspect=camP.aspect=camR.aspect=W/H;
 camB.updateProjectionMatrix();
 camK.updateProjectionMatrix();
 camP.updateProjectionMatrix();
 camR.updateProjectionMatrix();
 frameCam(camB,0,3.6,1.55);
 frameCam(camK,S.keysCenter||-0.26,S.keysNeedH||2.36,1.02);
 frameCam(camR,0.02,0.92,0.92,150,250);
 const tv=Math.tan(camP.fov*Math.PI/360);
 const top=Math.max(0,hudEl.getBoundingClientRect().bottom-6);
 const bottom=Math.max(0,H-uiEl.getBoundingClientRect().top+6);
 const availH=Math.max(160,H-top-bottom);
 const visPeek=2*tv*CAM_P_NEAR;
 const shiftPx=H/2-(top+availH/2);
 const lookY=.128-shiftPx*visPeek/H;
 camP.position.set(0,lookY,CAM_P_FAR);
 camP.lookAt(0,lookY,0);
 camP.userData.lookY=lookY;
}
addEventListener('resize',()=>{
 clearTimeout(window.__rz);
 window.__rz=setTimeout(layout,120);
});

 ]);

 const OutputPass=mods[3].OutputPass;

/* ===== 主循环 ===== */
function tick(){
 const now=performance.now();

 S.boxes.forEach((b,i)=>{
  const sel=(S.phase==='box'&&i===S.selBox);
  b.g.position.z+=((sel?.55:0)-b.g.position.z)*.14;
  const s=b.g.scale.x+((sel?1.22:1)-b.g.scale.x)*.14;
  b.g.scale.setScalar(s);
 });

 if(S.phase==='opening'&&S.boxes[S.selBox]){
  const lid=S.boxes[S.selBox].g.userData.lid;
  lid.rotation.x+=(-1.15-lid.rotation.x)*.1;
 }

 const insp=S.insp;
 if(insp&&S.phase==='reveal'&&insp.obj){
  const t=Math.min(1,(now-insp.t0)/420);
  const e=1-Math.pow(1-t,3);
  if(!insp.crumbled)
   insp.obj.scale.setScalar(Math.max(.001,e*(1+.14*Math.sin(t*Math.PI))));
  insp.obj.position.y=.004+Math.sin(now*.0018)*.008;
  if(insp.spin>.001){
   insp.rot+=insp.spin;
   insp.spin*=.94;
   insp.rotTarget=insp.rot;
  }
  const prev=insp.rot;
  insp.rot+=(insp.rotTarget-insp.rot)*.17;
  insp.turn+=Math.abs(insp.rot-prev);
  insp.obj.rotation.y=insp.rot;

  if(!insp.isEvt){
   if(insp.turn>1.6&&!insp.unlocked){
    insp.unlocked=true;
    stHint.textContent='轻 点 收 下';
   }
   if(!insp.unlocked)stHint.textContent='转 动 查 看';
   for(const m of insp.marks){
    if(m.found)continue;
    let a=(m.angle+insp.rot)%(Math.PI*2);
    if(a<0)a+=Math.PI*2;
    const d=Math.min(a,Math.PI*2-a);

/* ---------- ⑤ 推理：线索生成 ---------- */
function buildClue(lock,vis){
 var hidden=[0,1,2,3].filter(function(i){return vis.indexOf(i)<0;});
 var sum=lock.reduce(function(a,b){return a+b;},0);
 var opts=[];
 opts.push({t:'sum',v:sum,txt:'四根锁芯的格数加起来 = '+sum});
 for(var i=0;i<hidden.length;i++){
  for(var j=0;j<hidden.length;j++){
   if(i===j)continue;
   var a=hidden[i],b=hidden[j];
   var d=lock[a]-lock[b];
   if(d>0)opts.push({t:'diff',a:a,b:b,d:d,
    txt:'第 '+(a+1)+' 根比第 '+(b+1)+' 根长 '+d+' 格'});
  }
 }
 var mx=Math.max.apply(null,lock);
 if(lock.filter(function(x){return x===mx;}).length===1){
  var k=lock.indexOf(mx);
  opts.push({t:'max',k:k,txt:'四根里最长的是第 '+(k+1)+' 根'});
 }
 return opts[rnd(opts.length)];
}
function clueTest(cl,c){
 if(!cl)return true;
 if(cl.t==='sum')return c.reduce(function(a,b){return a+b;},0)===cl.v;
 if(cl.t==='diff')return (c[cl.a]-c[cl.b])===cl.d;
 if(cl.t==='max'){
  var mx=Math.max.apply(null,c);
  if(c.filter(function(x){return x===mx;}).length!==1)return false;
  return c.indexOf(mx)===cl.k;
 }
 return true;
}
function logicCodes(){
 var lock=S.lock,vis=S.logicVis;
 var codes=[lock.slice()];
 var hidden=[0,1,2,3].filter(function(i){return vis.indexOf(i)<0;});
 var guard=0;
 // 两个「看得见的都对、但违反线索」的干扰项
 while(codes.length<3&&guard++<600){
  var c=lock.slice();
  for(var i=0;i<hidden.length;i++) c[hidden[i]]=rnd(5);
  if(same(c,lock))continue;
  if(codes.some(function(x){return same(x,c);}))continue;
  if(clueTest(S.logicClue,c))continue;
  codes.push(c);
 }
 // 三个「看得见的就不对」的干扰项
 guard=0;
 while(codes.length<6&&guard++<600){
  var c2=lock.slice();
  var vi=vis[rnd(vis.length)];
  c2[vi]=rnd(5);
  if(c2[vi]===lock[vi])continue;
  if(codes.some(function(x){return same(x,c2);}))continue;
  codes.push(c2);
 }
 while(codes.length<6){
  var c3=lock.map(function(){return rnd(5);});
  if(codes.some(function(x){return same(x,c3);}))continue;
  codes.push(c3);
 }
 for(var i=codes.length-1;i>0;i--){
  var j=rnd(i+1);var t=codes[i];codes[i]=codes[j];codes[j]=t;
 }
 return codes;
}

/* ---------- 候选条件库 ---------- */
function buildCands(lock){
 var out=[];
 var sum=lock.reduce(function(a,b){return a+b;},0);
 out.push({txt:'四根格数加起来 = '+sum,
  test:function(c){return c.reduce(function(a,b){return a+b;},0)===sum;}});

 var mx=Math.max.apply(null,lock);
 if(lock.filter(function(x){return x===mx;}).length===1){
  var k=lock.indexOf(mx);
  out.push({txt:'最高的一根是第 '+(k+1)+' 根',
   test:function(c){
    var m=Math.max.apply(null,c);
    return c.filter(function(x){return x===m;}).length===1 && c.indexOf(m)===k;
   }});
 }
 for(var i=0;i<4;i++){
  for(var j=0;j<4;j++){
   if(i===j)continue;
   var d=lock[i]-lock[j];
   if(d>0){
    (function(a,b,dd){
     out.push({txt:'第 '+(a+1)+' 根比第 '+(b+1)+' 根高 '+dd+' 格',
      test:function(c){return (c[a]-c[b])===dd;}});
    })(i,j,d);
   }
   if(i<j){
    (function(a,b){
     var s2=lock[a]+lock[b];
     out.push({txt:'第 '+(a+1)+' 根和第 '+(b+1)+' 根加起来 = '+s2+' 格',
      test:function(c){return (c[a]+c[b])===s2;}});
    })(i,j);
   }
  }
 }
 var z=lock.filter(function(x){return x===0;}).length;
 out.push({txt:(z?'四根里有一根是平的（0 格）':'四根里没有一根是平的'),
  test:function(c){return c.filter(function(x){return x===0;}).length===z;}});
 return out;
}

function pickClueSet(pool,lock){
 var cands=buildCands(lock);
 for(var i=cands.length-1;i>0;i--){var j=rnd(i+1);var t=cands[i];cands[i]=cands[j];cands[j]=t;}
 var a,b,r;
 for(a=0;a<cands.length;a++){
  r=pool.filter(cands[a].test);
  if(r.length>=2&&r.length<=3)return [cands[a]];
 }
 for(a=0;a<cands.length;a++){
  for(b=a+1;b<cands.length;b++){
   (function(s1,s2){
    var rr=pool.filter(function(k){return s1.test(k)&&s2.test(k);});
    if(rr.length>=2&&rr.length<=3)r=[s1,s2];
   })(cands[a],cands[b]);
   if(r&&r.length===2)return r;
  }
 }
 return [cands[0]];
}
function findSolo(surv,lock){
 var cands=buildCands(lock);
 for(var i=0;i<cands.length;i++){
  var r=surv.filter(cands[i].test);
  if(r.length===1&&same(r[0],lock))return cands[i];
 }
 return null;
}

let LOGIC_LV=0;
(function(){
 const setList=document.getElementById('setList');
 const lab=document.createElement('div');
 lab.className='lab';lab.style.marginTop='14px';lab.textContent='推 理 难 度';

 [].slice.call(row.querySelectorAll('button')).forEach(function(b){
  b.onclick=function(){
   LOGIC_LV=+b.dataset.l;
   [].slice.call(row.querySelectorAll('button')).forEach(function(x){
    x.classList.remove('on');
   });

   toast('推理难度：'+b.textContent+'<br>下一局生效',1500);
  };

const _bk4=buildKeys;
buildKeys=function(swan,n){
 if(!MODE.logic){ _bk4(swan,n); return; }

 clearGroup(keysRoot);
 const lock=S.lock;
 const K=[6,7,8][LOGIC_LV];
 const nClue=[2,1,1][LOGIC_LV];
 const vi=rnd(4);
 const codes=[lock.slice()];
 var guard=0,c,i;

 const sameWant=Math.min(3,K-3);
 while(codes.length-1<sameWant&&guard++<900){
  c=lock.slice();
  for(i=0;i<4;i++) if(i!==vi) c[i]=rnd(5);
  if(same(c,lock))continue;
  if(codes.some(function(x){return same(x,c);}))continue;
  codes.push(c);
 }
 guard=0;
 while(codes.length<K&&guard++<1400){
  c=lock.slice();
  var v=rnd(5);
  if(v===lock[vi])v=(v+1+rnd(4))%5;
  c[vi]=v;
  if(codes.some(function(x){return same(x,c);}))continue;
  codes.push(c);
 }

 const pool=codes.filter(function(x){return x[vi]===lock[vi];});
 var set=pickClueSet(pool,lock);
 if(nClue===1)set=[set[0]];

 S.logicVi=vi;
 S.logicClues=set;
 S.logicSolo=null;
 S.logicSurv=codes.filter(function(x){
  if(x[vi]!==lock[vi])return false;
  return set.every(function(s){return s.test(x);});
 });

 for(var q=codes.length-1;q>0;q--){
  var j2=rnd(q+1),tt=codes[q];codes[q]=codes[j2];codes[j2]=tt;
 }
 S.keys=codes.map(function(code,k){
  var g=makeKey(code);
  g.position.set((Math.random()-.5)*.62,
                 .52-k*.28+(Math.random()-.5)*.14,
                 -.04+k*.015);
  g.rotation.z=(Math.random()-.5)*.85;
  g.rotation.x=(Math.random()-.5)*.20;
  keysRoot.add(g);
  var obj={g:g,id:k,code:code,teeth:g.userData.teeth,mat:g.userData.mat,
   viewed:true,revealUntil:Infinity,dead:false};
  g.traverse(function(o){o.userData.keyRef=obj;});
  return obj;
 });
 S.keysCenter=0.02;
 S.keysNeedH=3.1;
 layout();
};

/* ---------- ⑤ 推理困难/噩梦：齿数增加 ---------- */
buildCands=function(lock){
 const N=lock.length;
 const out=[];
 const sum=lock.reduce(function(a,b){return a+b;},0);
 out.push({txt:'所有格数加起来 = '+sum,
  test:function(c){return c.reduce(function(a,b){return a+b;},0)===sum;}});
 const mx=Math.max.apply(null,lock);
 if(lock.filter(function(x){return x===mx;}).length===1){
  const k=lock.indexOf(mx);
  out.push({txt:'最高的一根是第 '+(k+1)+' 根',
   test:function(c){
    const m=Math.max.apply(null,c);
    return c.filter(function(x){return x===m;}).length===1&&c.indexOf(m)===k;
   }});
 }
 for(let i=0;i<N;i++){
  for(let j=0;j<N;j++){
   if(i===j)continue;
   const d=lock[i]-lock[j];
   if(d>0){
    out.push({txt:'第 '+(i+1)+' 根比第 '+(j+1)+' 根高 '+d+' 格',
     test:(function(a,b,dd){return function(c){return c[a]-c[b]===dd;};})(i,j,d)});
   }
   if(i<j){
    const s2=lock[i]+lock[j];
    out.push({txt:'第 '+(i+1)+' 根和第 '+(j+1)+' 根加起来 = '+s2+' 格',
     test:(function(a,b,ss){return function(c){return c[a]+c[b]===ss;};})(i,j,s2)});
   }
  }
 }
 const z=lock.filter(function(x){return x===0;}).length;
 out.push({txt:(z?'有一根是平的（0 格）':'没有一根是平的'),
  test:function(c){return c.filter(function(x){return x===0;}).length===z;}});
 return out;
};

const _cf5=confirmBox;
confirmBox=function(){
 if(MODE.logic){
  MODE.teeth=[4,5,6][LOGIC_LV];
  MODE.step=[.050,.042,.036][LOGIC_LV];
 }
 _cf5();
};

const _bk5=buildKeys;
buildKeys=function(swan,n){
 if(!MODE.logic){ _bk5(swan,n); return; }

 clearGroup(keysRoot);
 const lock=S.lock,N=lock.length;
 const K=[6,7,8][LOGIC_LV];
 const nClue=[2,1,1][LOGIC_LV];
 const vi=rnd(N);
 const codes=[lock.slice()];
 var guard=0,c,i;

 const sameWant=Math.min(3,K-3);
 while(codes.length-1<sameWant&&guard++<1500){
  c=lock.slice();
  for(i=0;i<N;i++) if(i!==vi) c[i]=rnd(5);
  if(same(c,lock))continue;
  if(codes.some(function(x){return same(x,c);}))continue;
  codes.push(c);
 }
 guard=0;
 while(codes.length<K&&guard++<3000){
  c=lock.slice();
  var v=rnd(5);
  if(v===lock[vi])v=(v+1+rnd(4))%5;
  c[vi]=v;
  if(codes.some(function(x){return same(x,c);}))continue;
  codes.push(c);
 }

 const pool=codes.filter(function(x){return x[vi]===lock[vi];});
 var set=pickClueSet(pool,lock);
 if(nClue===1)set=[set[0]];

 S.logicVi=vi;
 S.logicClues=set;
 S.logicSolo=null;
 S.logicSurv=codes.filter(function(x){
  if(x[vi]!==lock[vi])return false;
  return set.every(function(s){return s.test(x);});
 });

 for(var q=codes.length-1;q>0;q--){
  var j2=rnd(q+1),tt=codes[q];codes[q]=codes[j2];codes[j2]=tt;

        if(l==='0'||l==='1'||l==='2'){ MODE=MODES.logic; paintModes(); }  /* 点普通逻辑难度 → 退回普通推理 */
      },true);
    }
    if(row.querySelector('button[data-l="3"]')) return;
    var b=document.createElement('button');
    b.textContent='地狱';
    b.setAttribute('data-l','3');
    b.onclick=function(){
      MODE=MODES.logicHell;
      LOGIC_LV=0;               /* 0 = 6 把钥匙 + 2 条免费提示 */
      [].slice.call(row.querySelectorAll('button')).forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      try{ SFX.tap(); haptic(10); paintModes(); }catch(e){}
      toast('推理·地狱：<b>6 根锁芯</b> · <b>2 条免费提示</b> · 错一次整箱作废',1900);
    };
    row.appendChild(b);
  },800);

})();  
</script>
</body>
</html>
