<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="齿口">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0705">
<title>齿口 · Keyhole</title>
<style>
:root{--gold:#e6c47f;--ink:#efe6d6;--bg:#0a0705}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

#vig{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.55;transition:opacity .45s;
  background:radial-gradient(circle at 50% 46%,#0000 30%,#00000055 55%,#000000e8 82%)}
#vig.on{opacity:1}

#hud{position:fixed;top:0;left:0;right:0;z-index:6;pointer-events:none;
  padding:calc(14px + env(safe-area-inset-top)) 18px 22px;
  display:flex;gap:18px;align-items:flex-start;
  font-size:10px;letter-spacing:.12em;color:#8f8270;
  background:linear-gradient(#000000d9,#0000)}
#hud b{display:block;color:var(--gold);font-size:18px;font-weight:700;letter-spacing:0;margin-top:3px}
#hud .sp{flex:1}
#btnReset{pointer-events:auto;flex:0 0 auto;padding:8px 12px;font-size:11px;letter-spacing:.05em;
  border-radius:10px;border:1px solid #ffffff1c;background:#ffffff08;color:#877c6c}

#ui{position:fixed;left:0;right:0;bottom:0;z-index:6;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(#0000,#000000eb 46%)}
.row{display:flex;gap:10px}
button{font-family:inherit;flex:1;padding:16px 6px;border-radius:15px;
  border:1px solid #ffffff1a;background:#171210e0;color:var(--ink);
  font-size:15px;font-weight:600;transition:transform .12s,opacity .25s;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
button:active{transform:scale(.972)}
button:disabled{opacity:.26}
button.gold{background:linear-gradient(#eccd85,#a8853c);color:#1c1206;
  border-color:#f6e2b4;box-shadow:0 8px 26px #e6c47f33}
#msg{text-align:center;font-size:12.5px;line-height:1.55;color:#a2957f;min-height:19px}

#peekBar{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:7;background:#ffffff12;display:none}
#peekBar i{display:block;height:100%;width:100%;transform-origin:left;
  background:linear-gradient(90deg,#e6c47f,#fff6dd)}

#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.94);
  z-index:9;padding:24px 32px;border-radius:22px;text-align:center;
  background:#0b0806f7;border:1px solid #ffffff1f;
  box-shadow:0 26px 80px #000d,inset 0 1px 0 #ffffff12;
  opacity:0;transition:.26s cubic-bezier(.2,.9,.3,1.15);pointer-events:none;
  font-size:13px;line-height:1.7;color:#c0b4a0;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast b{display:block;font-size:25px;font-weight:700;color:var(--gold);margin:5px 0}

#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px;
  background:radial-gradient(120% 75% at 50% 32%,#20160d 0%,#0a0705 60%,#040302 100%);
  transition:opacity .55s,visibility .55s}
#title.off{opacity:0;visibility:hidden}
#title h1{margin:0;font-size:46px;font-weight:200;color:var(--gold);
  letter-spacing:.44em;text-indent:.44em;text-shadow:0 0 46px #e6c47f66}
#title .en{font-size:9px;letter-spacing:.52em;text-indent:.52em;color:#7a6a53;margin-top:14px}
#title .rule{width:54px;height:1px;margin:26px 0;
  background:linear-gradient(90deg,#0000,#e6c47f,#0000)}
#title p{font-size:12.5px;line-height:2.05;color:#9c8f7b;text-align:center;margin:0;max-width:312px}
#title p em{color:var(--gold);font-style:normal}
#btnStart{margin-top:34px;flex:0 0 auto;padding:17px 56px;border-radius:100px;border:none;
  background:linear-gradient(#eccd85,#a8853c);color:#1c1206;font-size:16px;
  font-weight:700;letter-spacing:.16em;box-shadow:0 12px 36px #e6c47f38}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vig"></div>

<header id="hud">
  <div>金币<b id="hCoins">120</b></div>
  <div>灯油<b id="hOil">5</b></div>
  <div>开箱<b id="hOpened">0</b></div>
  <div class="sp"></div>
  <button id="btnReset">重开</button>
</header>

<section id="ui">
  <div id="msg">点开一只箱子</div>
  <div class="row">
    <button id="btnA">…</button>
    <button id="btnB" class="gold">…</button>
  </div>
</section>

<div id="peekBar"><i></i></div>
<div id="toast"></div>

<div id="title">
  <h1>齿口</h1>
  <div class="en">K E Y H O L E</div>
  <div class="rule"></div>
  <p>
    三只箱子，玻璃下只露出<em>最上层</em>的东西。<br>
    选定后只能看<em>一次</em>锁孔，再凭记忆挑钥匙。<br>
    开了才归你 —— 但箱底可能<em>什么都没有</em>。
  </p>
  <button id="btnStart">开 始</button>
</div>

<script>
window.addEventListener('error', e => err(e.message));
window.addEventListener('unhandledrejection', e => err((e.reason && e.reason.message) || e.reason));
function err(m){
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;z-index:99;background:#000;color:#ff9c9c;padding:24px;'+
    'font-size:12px;line-height:1.7;overflow:auto;white-space:pre-wrap">出错了：\n' + m + '</div>');
}
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 配置 ================= */
const CFG = {
  startCoins: 120,
  price     : 20,
  oilMax    : 5,
  oilStart  : 5,
  boxCount  : 3,
  keyCount  : 5,
  peekMs    : 5000,
  viewMs    : 2600,
  teeth     : 0.05,
  tiers: [
    { name:'木箱', metal:0x8a6a3a, n:[1,1],
      mult:[{p:.60,v:1},{p:.25,v:2},{p:.15,v:0}], w:.50 },
    { name:'铁箱', metal:0x9aa1aa, n:[2,2],
      mult:[{p:.55,v:1},{p:.30,v:2.2},{p:.15,v:0}], w:.35 },
    { name:'金箱', metal:0xd8b25c, n:[3,3],
      mult:[{p:.40,v:1},{p:.25,v:2.5},{p:.35,v:0}], w:.15 }
  ]
};

/* ================= 音效 ================= */
let AC = null;
const ac = () => {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
};
function tone(f, d, t='sine', v=.12, to=0){
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = t; o.frequency.value = f;
  if (to) o.frequency.exponentialRampToValueAtTime(to, c.currentTime + d);
  g.gain.setValueAtTime(v, c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + d);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + d + .03);
}
function noise(d, v=.08, hp=1600){
  const c = ac(), b = c.createBuffer(1, Math.floor(c.sampleRate*d), c.sampleRate);
  const a = b.getChannelData(0);
  for (let i=0;i<a.length;i++) a[i] = (Math.random()*2-1) * Math.pow(1-i/a.length, 3);
  const s = c.createBufferSource(); s.buffer = b;
  const f = c.createBiquadFilter(); f.type='highpass'; f.frequency.value = hp;
  const g = c.createGain(); g.gain.value = v;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
const SFX = {
  tap  : () => tone(920,.05,'triangle',.07),
  lift : () => tone(560,.13,'sine',.09,760),
  peek : () => { noise(.45,.05,900); tone(170,.7,'sine',.045,110); },
  wrong: () => { tone(115,.4,'sawtooth',.09,62); noise(.22,.07,260); },
  open : () => [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.55,'sine',.09),i*85)),
  empty: () => { tone(88,.6,'sine',.09,58); noise(.2,.04,400); }
};

/* ================= 渲染 ================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.9));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const pmrem = new THREE.PMREMGenerator(renderer);
const ENV = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

/* ================= 程序化纹理 ================= */
function woodTex(){
  const N = 512, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const x = cv.getContext('2d');
  x.fillStyle = '#2b1a0f'; x.fillRect(0, 0, N, N);
  for (let i = 0; i < 220; i++){
    const y0 = Math.random() * N;
    const r = 55 + Math.random()*45, g = 30 + Math.random()*28, b = 14 + Math.random()*16;
    x.strokeStyle = `rgba(${r|0},${g|0},${b|0},${.12 + Math.random()*.38})`;
    x.lineWidth = .5 + Math.random()*2.2;
    x.beginPath(); x.moveTo(-10, y0);
    for (let px = 0; px <= N + 10; px += 14)
      x.lineTo(px, y0 + Math.sin(px*.015 + i*.7)*7 + (Math.random()-.5)*2.4);
    x.stroke();
  }
  for (let i = 0; i < 1200; i++){
    x.fillStyle = 'rgba(0,0,0,' + (Math.random()*.16) + ')';
    x.fillRect(Math.random()*N, Math.random()*N, 1.5, 1.5);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
function velvetTex(){
  const N = 256, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const x = cv.getContext('2d');
  x.fillStyle = '#170d07'; x.fillRect(0, 0, N, N);
  for (let i = 0; i < 9000; i++){
    const v = Math.random();
    x.fillStyle = v > .5 ? 'rgba(120,70,40,.06)' : 'rgba(0,0,0,.12)';
    x.fillRect(Math.random()*N, Math.random()*N, 2, 2);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const WOOD = woodTex(), VELVET = velvetTex();

/* ================= 材质 ================= */
const MAT = {
  brass : new THREE.MeshStandardMaterial({ color:0xd0a04c, metalness:1, roughness:.24 }),
  brassD: new THREE.MeshStandardMaterial({ color:0x7d6128, metalness:1, roughness:.52 }),
  gold  : new THREE.MeshStandardMaterial({ color:0xf0c96e, metalness:1, roughness:.16 }),
  silver: new THREE.MeshStandardMaterial({ color:0xdfe4ea, metalness:1, roughness:.14 }),
  pearl : new THREE.MeshStandardMaterial({ color:0xf6ece4, metalness:.1, roughness:.28 }),
  gem   : new THREE.MeshStandardMaterial({ color:0x4f9dff, metalness:.35, roughness:.06,
            emissive:0x1a4f96, emissiveIntensity:.9, flatShading:true }),
  wood  : new THREE.MeshStandardMaterial({ map:WOOD, roughness:.82, metalness:.04 }),
  velvet: new THREE.MeshStandardMaterial({ map:VELVET, color:0x2a1a10, roughness:.98 }),
  dark  : new THREE.MeshStandardMaterial({ color:0x0d0906, roughness:.95 })
};
MAT.velvet.map.repeat.set(2, 2);
MAT.wood.map.repeat.set(1.4, 1.4);

function lightRig(s, k, shadow){
  s.add(new THREE.HemisphereLight(0x6d7d9a, 0x1a0f07, .45));
  const a = new THREE.DirectionalLight(0xfff0d2, k);
  a.position.set(1.8, 2.6, 2.4);
  if (shadow){
    a.castShadow = true;
    a.shadow.mapSize.set(1024, 1024);
    a.shadow.bias = -0.0009;
    const sc = a.shadow.camera;
    sc.left = -2.4; sc.right = 2.4; sc.top = 3.2; sc.bottom = -3.2; sc.near = .5; sc.far = 12;
  }
  s.add(a);
  const b = new THREE.DirectionalLight(0x86a8ff, .75);
  b.position.set(-2.2, -.6, 1.4); s.add(b);
}
function glowTex(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,214,150,.6)');
  g.addColorStop(.42,'rgba(255,186,120,.14)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(cv);
}
const GLOW = glowTex();
const glowMat = o => new THREE.MeshBasicMaterial({
  map:GLOW, transparent:true, opacity:o||1, blending:THREE.AdditiveBlending, depthWrite:false
});

/* ================= 场景 A：选箱 ================= */
const sceneB = new THREE.Scene();
sceneB.background = new THREE.Color(0x070504);
sceneB.environment = ENV;
lightRig(sceneB, 2.9, true);

const wallB = new THREE.Mesh(new THREE.PlaneGeometry(7, 9),
  new THREE.MeshStandardMaterial({ map:VELVET, color:0x1c1008, roughness:1 }));
wallB.position.set(0, 0, -.55); wallB.receiveShadow = true; sceneB.add(wallB);

const glowB = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 4.8), glowMat(.7));
glowB.position.set(0, 0, -.5); sceneB.add(glowB);

const boxRoot = new THREE.Group(); sceneB.add(boxRoot);
const camB = new THREE.PerspectiveCamera(45, 1, .1, 60);

/* ================= 场景 B：锁 ================= */
const sceneL = new THREE.Scene();
sceneL.background = new THREE.Color(0x050403);
sceneL.environment = ENV;
lightRig(sceneL, 1.1, false);
const ptL = new THREE.PointLight(0xffcf95, 7, 4); ptL.position.set(.35, .55, .9); sceneL.add(ptL);

function plateTex(){
  const N = 512, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, N, N);
  g.addColorStop(0,'#d8b062'); g.addColorStop(.4,'#8f6d2c');
  g.addColorStop(.7,'#6b4f1b'); g.addColorStop(1,'#b08a3e');
  x.fillStyle = g; x.fillRect(0,0,N,N);
  for (let i = 0; i < 4000; i++){
    x.fillStyle = 'rgba(0,0,0,' + (Math.random()*.1) + ')';
    x.fillRect(Math.random()*N, Math.random()*N, 2, 2);
  }
  for (let i = 0; i < 60; i++){
    x.strokeStyle = 'rgba(255,240,205,' + (Math.random()*.07) + ')';
    x.lineWidth = Math.random()*1.4;
    x.beginPath(); x.moveTo(Math.random()*N, Math.random()*N);
    x.lineTo(Math.random()*N, Math.random()*N); x.stroke();
  }
  [[.10,.10],[.90,.10],[.10,.90],[.90,.90],[.50,.06],[.50,.94]].forEach(([a,b]) => {
    x.beginPath(); x.arc(a*N,b*N,10,0,Math.PI*2); x.fillStyle='#5b421a'; x.fill();
    x.beginPath(); x.arc(a*N-2,b*N-2,7,0,Math.PI*2); x.fillStyle='#cfa860'; x.fill();
  });
  x.globalCompositeOperation = 'destination-out';
  x.beginPath(); x.arc(N*.5, N*.42, N*.085, 0, Math.PI*2); x.fill();
  x.beginPath();
  x.moveTo(N*.5 - N*.036, N*.46); x.lineTo(N*.5 + N*.036, N*.46);
  x.lineTo(N*.5 + N*.058, N*.70); x.lineTo(N*.5 - N*.058, N*.70);
  x.closePath(); x.fill();
  x.globalCompositeOperation = 'source-over';
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = 4;
  return t;
}
const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.6),
  new THREE.MeshStandardMaterial({ map:plateTex(), metalness:.85, roughness:.42, alphaTest:.5 }));
sceneL.add(plate);

const bezel = new THREE.Mesh(new THREE.TorusGeometry(.152, .012, 14, 40), MAT.brassD);
bezel.position.set(0, .128, .006);
sceneL.add(bezel);

const pins = [];
for (let i = 0; i < 4; i++){
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.016, .016, 1, 18), MAT.brass);
  p.position.set(-.12 + i*.08, .16, -.09);
  p.visible = false;
  sceneL.add(p); pins.push(p);
}
const camP = new THREE.PerspectiveCamera(40, 1, .05, 60);
const CAM_P_NEAR = 1.05, CAM_P_FAR = 1.95;

/* ================= 场景 C：钥匙架 ================= */
const sceneK = new THREE.Scene();
sceneK.background = new THREE.Color(0x070504);
sceneK.environment = ENV;
lightRig(sceneK, 2.3, true);

const boardK = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3.1, .07), MAT.velvet);
boardK.position.set(0, -.24, -.22);
boardK.receiveShadow = true; sceneK.add(boardK);

const glowK = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 4.2), glowMat(.85));
glowK.position.set(0, -.24, -.2); sceneK.add(glowK);

const keysRoot = new THREE.Group(); sceneK.add(keysRoot);
const camK = new THREE.PerspectiveCamera(45, 1, .1, 60);

/* ================= 物品 ================= */
const ITEMS = [
  { name:'金币', value:12, kind:'coin' },
  { name:'银戒', value:22, kind:'ring' },
  { name:'珍珠', value:28, kind:'pearl' },
  { name:'宝石', value:45, kind:'gem' }
];
function makeItem(kind){
  const g = new THREE.Group();
  if (kind === 'coin'){
    const d = new THREE.Mesh(new THREE.CylinderGeometry(.052,.052,.010,26), MAT.gold);
    const r = new THREE.Mesh(new THREE.TorusGeometry(.05,.006,10,26), MAT.gold);
    r.rotation.x = Math.PI/2; r.position.y = .005;
    const r2 = r.clone(); r2.position.y = -.005;
    g.add(d, r, r2);
  } else if (kind === 'ring'){
    const t = new THREE.Mesh(new THREE.TorusGeometry(.042,.010,14,28), MAT.silver);
    t.rotation.x = Math.PI/2; g.add(t);
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(.016), MAT.silver);
    s.position.set(.042,.008,0); s.scale.y = .7; g.add(s);
  } else if (kind === 'pearl'){
    const s = new THREE.Mesh(new THREE.SphereGeometry(.038,24,18), MAT.pearl);
    s.position.y = .034; g.add(s);
  } else {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(.055), MAT.gem);
    s.position.y = .034; s.rotation.set(.3,.7,.2); g.add(s);
  }
  g.traverse(o => { if (o.isMesh){ o.castShadow = true; } });
  return g;
}

/* ================= 箱子 ================= */
function makeBox(tier, items){
  const g = new THREE.Group();
  const bodyMat = MAT.wood.clone();
  bodyMat.map = MAT.wood.map;
  const body = new THREE.Mesh(new THREE.BoxGeometry(.9,.38,.56), bodyMat);
  g.add(body);

  const metal = new THREE.MeshStandardMaterial({ color:tier.metal, metalness:.95, roughness:.32 });

  [-.12, .12].forEach(y => {
    const band = new THREE.Mesh(new THREE.BoxGeometry(.93,.045,.585), metal);
    band.position.y = y; g.add(band);
  });
  [-.44, .44].forEach(x => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(.03,.40,.58), metal);
    p.position.x = x; g.add(p);
  });

  const latch = new THREE.Mesh(new THREE.BoxGeometry(.11,.08,.03), metal);
  latch.position.set(0, .02, .292); g.add(latch);
  const hole = new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.02,12), MAT.dark);
  hole.rotation.x = Math.PI/2; hole.position.set(0, .02, .305); g.add(hole);

  const velv = new THREE.Mesh(new THREE.PlaneGeometry(.79,.45), MAT.velvet);
  velv.rotation.x = -Math.PI/2; velv.position.y = .191; velv.receiveShadow = true;
  g.add(velv);

  const lit = new THREE.Mesh(new THREE.PlaneGeometry(.85,.55), glowMat(.5));
  lit.rotation.x = -Math.PI/2; lit.position.y = .196; g.add(lit);

  items.forEach((it, i) => {
    const m = makeItem(it.kind);
    const n = items.length;
    m.position.x = (i - (n-1)/2) * .235;
    m.position.z = (Math.random()-.5) * .10;
    m.position.y = .198;
    g.add(m);
  });

  const glass = new THREE.Mesh(new THREE.PlaneGeometry(.8,.46),
    new THREE.MeshStandardMaterial({ color:0xa8c8ff, transparent:true, opacity:.13,
      roughness:.04, metalness:.15, side:THREE.DoubleSide, depthWrite:false }));
  glass.rotation.x = -Math.PI/2; glass.position.y = .295; g.add(glass);

  const rimMat = metal;
  const rT = new THREE.Mesh(new THREE.BoxGeometry(.94,.03,.045), rimMat);
  rT.position.set(0,.30,.245); g.add(rT);
  const rB = rT.clone(); rB.position.z = -.245; g.add(rB);
  const rL = new THREE.Mesh(new THREE.BoxGeometry(.045,.03,.54), rimMat);
  rL.position.set(-.445,.30,0); g.add(rL);
  const rR = rL.clone(); rR.position.x = .445; g.add(rR);

  [-.42,.42].forEach(x => [-.23,.23].forEach(z => {
    const post = new THREE.Mesh(new THREE.BoxGeometry(.03,.115,.03), rimMat);
    post.position.set(x,.245,z); g.add(post);
  }));

  const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.02,.05,.68), MAT.brassD);
  shelf.position.y = -.225; shelf.receiveShadow = true; g.add(shelf);

  g.traverse(o => { if (o.isMesh && o.material !== glass.material){ o.castShadow = true; } });
  g.rotation.x = .42;
  return g;
}

/* ================= 钥匙 ================= */
function makeKey(code){
  const mat = MAT.brass.clone();
  const g = new THREE.Group();

  const bow = new THREE.Mesh(new THREE.TorusGeometry(.088,.019,18,36), mat);
  bow.position.x = -.235; g.add(bow);
  const boss = new THREE.Mesh(new THREE.SphereGeometry(.022,16,12), mat);
  boss.position.x = -.235; boss.scale.z = .55; g.add(boss);

  const neck = new THREE.Mesh(new THREE.BoxGeometry(.10,.042,.024), mat);
  neck.position.x = -.152; g.add(neck);

  const blade = new THREE.Mesh(new THREE.BoxGeometry(.40,.056,.024), mat);
  blade.position.x = .085; g.add(blade);

  const tip = new THREE.Mesh(new THREE.BoxGeometry(.06,.056,.024), mat);
  tip.position.x = .30; tip.rotation.z = .18; g.add(tip);

  const spine = new THREE.Mesh(new THREE.BoxGeometry(.40,.014,.026), mat);
  spine.position.set(.085,.035,0); g.add(spine);

  const teeth = new THREE.Group();
  for (let i = 0; i < 4; i++){
    const dep = .04 + code[i] * CFG.teeth;
    const t = new THREE.Mesh(new THREE.BoxGeometry(.055, dep, .024), mat);
    t.position.set(-.085 + i*.062, -.028 - dep/2, 0);
    teeth.add(t);
    const bev = new THREE.Mesh(new THREE.BoxGeometry(.055, .012, .026), mat);
    bev.position.set(-.085 + i*.062, -.028 - dep + .006, 0);
    teeth.add(bev);
  }
  g.add(teeth);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData = { teeth, mat };
  return g;
}

/* ================= 状态 ================= */
const S = {
  coins: CFG.startCoins, oil: CFG.oilStart, opened: 0,
  boxes: [], selBox: -1,
  lock: [], keys: [], selKey: -1,
  phase: 'title', peeking: false, peeked: false,
  busy: false, peekUntil: 0
};
const rnd = n => Math.floor(Math.random()*n);
const same = (a,b) => a.every((v,i) => v === b[i]);
const $ = id => document.getElementById(id);
const hCoins = $('hCoins'), hOil = $('hOil'), hOpened = $('hOpened');
const msgEl = $('msg'), toastEl = $('toast'), vig = $('vig');
const btnA = $('btnA'), btnB = $('btnB');
const peekBar = $('peekBar'), peekFill = peekBar.querySelector('i');

const msg = t => msgEl.textContent = t;
let toastTimer = 0;
function toast(html, ms = 2100){
  toastEl.innerHTML = html;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms);
}
function updateUI(){
  hCoins.textContent = S.coins;
  hOil.textContent = S.oil;
  hOpened.textContent = S.opened;
  if (S.phase === 'box'){
    btnA.disabled = S.selBox < 0;
    btnA.textContent = S.selBox < 0 ? '先点一只箱子' : '选定这只箱子';
    btnB.disabled = false; btnB.textContent = '换一批';
  } else if (S.phase === 'lock'){
    btnA.disabled = S.peeked || S.oil <= 0;
    btnA.textContent = S.peeking ? '移开视线'
      : (S.peeked ? '已窥视过' : (S.oil <= 0 ? '灯油已尽' : '窥视锁孔 · −1 灯油'));
    btnB.disabled = false; btnB.textContent = '去挑钥匙 →';
  } else {
    btnA.disabled = false; btnA.textContent = '放弃这只箱子';
    btnB.disabled = S.selKey < 0 || S.busy;
    btnB.textContent = `买下并试开 · ${CFG.price} 金币`;
  }
}

/* ================= 回合 ================= */
function pickTier(){
  const r = Math.random(); let acc = 0;
  for (let i = 0; i < CFG.tiers.length; i++){
    acc += CFG.tiers[i].w;
    if (r < acc) return i;
  }
  return 0;
}
function pickMult(list){
  const r = Math.random(); let acc = 0;
  for (const m of list){ acc += m.p; if (r < acc) return m.v; }
  return 1;
}
function clearGroup(root){
  while (root.children.length){
    const c = root.children[0];
    root.remove(c);
    c.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && o.material.map === MAT.wood.map) return;
      if (o.material && !o.material.isMeshBasicMaterial && o.material !== MAT.brass &&
          o.material !== MAT.brassD && o.material !== MAT.velvet) o.material.dispose();
    });
  }
}
function newRound(){
  clearGroup(boxRoot);
  S.boxes = [];
  for (let i = 0; i < CFG.boxCount; i++){
    const ti = pickTier(), tier = CFG.tiers[ti];
    const n = tier.n[0] + rnd(tier.n[1] - tier.n[0] + 1);
    const items = [];
    for (let j = 0; j < n; j++) items.push(ITEMS[rnd(ITEMS.length)]);
    const surface = items.reduce((a,b) => a + b.value, 0);
    const g = makeBox(tier, items);
    g.position.set(0, 1.02 - i*1.02, 0);
    boxRoot.add(g);
    g.traverse(o => o.userData.boxIndex = i);
    S.boxes.push({ tier, items, surface, mult: pickMult(tier.mult), g });
  }
  S.selBox = -1; S.selKey = -1; S.busy = false;
  S.phase = 'box'; S.peeking = false; S.peeked = false;
  vig.classList.remove('on');
  peekBar.style.display = 'none';
  pins.forEach(p => p.visible = false);
  msg('点一只箱子，看清玻璃下摆着什么');
  updateUI();
}
function chooseBox(i){
  if (S.phase !== 'box' || S.busy) return;
  S.selBox = i;
  SFX.tap();
  const b = S.boxes[i];
  const names = [...new Set(b.items.map(x => x.name))];
  msg(`${b.tier.name}｜玻璃下：${names.join('、')}　底下有什么？不知道`);
  updateUI();
}
function confirmBox(){
  if (S.phase !== 'box' || S.selBox < 0) return;
  S.lock = [rnd(5),rnd(5),rnd(5),rnd(5)];
  S.lock.forEach((c,i) => {
    const dep = (.04 + c*CFG.teeth) * .95;
    pins[i].scale.y = dep;
    pins[i].position.y = .16 - dep/2;
  });
  buildKeys();
  S.phase = 'lock'; S.peeking = false; S.peeked = false;
  msg('看清锁芯 —— 但只有一次机会');
  updateUI();
}
function buildKeys(){
  clearGroup(keysRoot);
  const codes = [S.lock.slice()];
  while (codes.length < CFG.keyCount){
    const c = [rnd(5),rnd(5),rnd(5),rnd(5)];
    if (codes.some(x => same(x,c))) continue;
    codes.push(c);
  }
  for (let i = codes.length-1; i > 0; i--){
    const j = rnd(i+1);
    [codes[i], codes[j]] = [codes[j], codes[i]];
  }
  S.keys = codes.map((code, i) => {
    const g = makeKey(code);
    g.position.set(0, .64 - i*.44, 0);
    keysRoot.add(g);
    const obj = { g, id:i, code, teeth:g.userData.teeth, mat:g.userData.mat,
                  viewed:false, revealUntil:0, dead:false };
    g.traverse(o => o.userData.keyRef = obj);
    return obj;
  });
}

/* ================= 窥视 ================= */
function peekStart(){
  if (S.phase !== 'lock' || S.peeking) return;
  if (S.peeked){ toast('这只箱子已经看过了'); return; }
  if (S.oil <= 0){ toast('灯油用完了<b>只能凭记忆</b>'); return; }
  S.oil--; S.peeked = true; S.peeking = true;
  S.peekUntil = performance.now() + CFG.peekMs;
  pins.forEach(p => p.visible = true);
  vig.classList.add('on');
  peekBar.style.display = 'block';
  peekFill.style.transform = 'scaleX(1)';
  SFX.peek();
  msg('记住四根锁芯的高低（左→右 ＝ 齿 1–4）');
  updateUI();
}
function peekStop(){
  S.peeking = false;
  pins.forEach(p => p.visible = false);
  vig.classList.remove('on');
  peekBar.style.display = 'none';
  msg('灯油 −1。去挑钥匙吧');
  updateUI();
}

/* ================= 买钥匙 ================= */
function buyKey(){
  if (S.phase !== 'keys' || S.busy || S.selKey < 0) return;
  if (S.coins < CFG.price){ toast('金币不够<b>本局结束</b>'); return; }
  const k = S.keys[S.selKey], b = S.boxes[S.selBox];
  S.busy = true;
  S.coins -= CFG.price;
  S.selKey = -1;
  updateUI();
  const ok = same(k.code, S.lock);
  k.dead = true;
  setTimeout(() => {
    if (ok){
      const gain = Math.round(b.surface * b.mult);
      if (gain <= 0){
        SFX.empty();
        toast('开了 —— <b>空的</b>玻璃下那些是镀金的假货', 2300);
      } else {
        SFX.open();
        S.coins += gain;
        toast(`开了 —— <b>+${gain} 金币</b>这只箱子归你了`, 2300);
      }
      S.opened++;
      S.oil = Math.min(CFG.oilMax, S.oil + 1);
      updateUI();
      setTimeout(() => {
        S.busy = false;
        if (S.coins < CFG.price) toast('金币不够了<b>点右上角重开</b>', 4200);
        else newRound();
      }, 2250);
    } else {
      SFX.wrong();
      toast('钥匙卡住了<b>齿口不对</b>这把废了', 1900);
      S.busy = false; updateUI();
      msg('再挑一把 —— 箱子还在');
    }
  }, 280);
}

/* ================= 输入 ================= */
const ray = new THREE.Raycaster();
const pv = new THREE.Vector2();
function pickObj(ev, cam, root){
  pv.x = (ev.clientX/innerWidth)*2 - 1;
  pv.y = -(ev.clientY/innerHeight)*2 + 1;
  ray.setFromCamera(pv, cam);
  return ray.intersectObjects(root.children, true)[0];
}
renderer.domElement.addEventListener('pointerdown', ev => {
  if (S.busy) return;
  if (S.phase === 'box'){
    const hit = pickObj(ev, camB, boxRoot);
    if (hit && hit.object.userData.boxIndex >= 0) chooseBox(hit.object.userData.boxIndex);
  } else if (S.phase === 'keys'){
    const hit = pickObj(ev, camK, keysRoot);
    if (hit && hit.object.userData.keyRef){
      const k = hit.object.userData.keyRef;
      if (k.dead) return;
      S.selKey = k.id;
      S.keys.forEach(x => x.mat.emissive.setHex(0));
      k.mat.emissive.setHex(0x261a06);
      if (!k.viewed && k.revealUntil === 0){
        k.revealUntil = performance.now() + CFG.viewMs;
        SFX.lift();
        msg('记住这四个齿 —— 只能看这一次');
      } else {
        SFX.tap();
        msg('这把看过了，凭记忆决定');
      }
      updateUI();
    }
  }
});

/* ================= 按钮 ================= */
btnA.onclick = () => {
  if (S.phase === 'box') confirmBox();
  else if (S.phase === 'lock'){ S.peeking ? peekStop() : peekStart(); }
  else if (S.phase === 'keys') newRound();
};
btnB.onclick = () => {
  if (S.phase === 'box') newRound();
  else if (S.phase === 'lock'){ S.phase = 'keys'; msg('每把钥匙只能看一次，看完凭记忆买'); updateUI(); }
  else if (S.phase === 'keys') buyKey();
};
$('btnReset').onclick = () => {
  S.coins = CFG.startCoins; S.oil = CFG.oilStart; S.opened = 0;
  toastEl.classList.remove('on');
  newRound();
};
$('btnStart').onclick = () => {
  ac();
  $('title').classList.add('off');
  newRound();
};

/* ================= 取景（关键修复） ================= */
const hudEl = document.getElementById('hud');
const uiEl  = document.getElementById('ui');

function frameCam(cam, centerY, needH, needW){
  const W = innerWidth, H = innerHeight;
  const top = Math.max(0, hudEl.getBoundingClientRect().bottom - 8);
  const bottom = Math.max(0, H - uiEl.getBoundingClientRect().top + 8);
  const availH = Math.max(160, H - top - bottom);

  const tv = Math.tan(cam.fov * Math.PI / 360);
  const dV = (needH/2) / (tv * availH / H);
  const dH = (needW/2) / (tv * cam.aspect);
  const d  = Math.max(dV, dH);

  const visibleH = 2 * tv * d;
  const targetPx = top + availH/2;
  const shift = (H/2 - targetPx) * visibleH / H;

  const ty = centerY - shift;
  cam.position.set(0, ty, d);
  cam.lookAt(0, ty, 0);
}

function layout(){
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  if (composer) composer.setSize(W, H);
  camB.aspect = camK.aspect = camP.aspect = W / H;
  camB.updateProjectionMatrix(); camK.updateProjectionMatrix(); camP.updateProjectionMatrix();

  frameCam(camB, 0, 2.92, 1.38);
  frameCam(camK, -0.24, 2.34, 1.02);

  // 锁：只调整竖直方向的构图，远近由主循环控制
  const tv = Math.tan(camP.fov * Math.PI / 360);
  const top = Math.max(0, hudEl.getBoundingClientRect().bottom - 8);
  const bottom = Math.max(0, H - uiEl.getBoundingClientRect().top + 8);
  const availH = Math.max(160, H - top - bottom);
  const visPeek = 2 * tv * CAM_P_NEAR;
  const shiftPx = H/2 - (top + availH/2);
  const lookY = 0.128 - shiftPx * visPeek / H;
  camP.position.set(0, lookY, CAM_P_FAR);
  camP.lookAt(0, lookY, 0);
  camP.userData.lookY = lookY;
}
addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(layout, 120); });

/* ================= 后处理（可降级） ================= */
let composer = null, rp = null;
try {
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js')
  ]);
  composer = new EffectComposer(renderer);
  rp = new RenderPass(sceneB, camB);
  composer.addPass(rp);
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.72, 0.86));
  composer.addPass(new OutputPass());
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth, innerHeight);
} catch (e){
  composer = null;
  console.warn('bloom disabled', e);
}

layout();

/* ================= 主循环 ================= */
function tick(){
  const now = performance.now();

  S.boxes.forEach((b, i) => {
    const sel = (S.phase === 'box' && i === S.selBox);
    b.g.position.z += ((sel ? .42 : 0) - b.g.position.z) * .14;
    const s = b.g.scale.x + ((sel ? 1.09 : 1) - b.g.scale.x) * .14;
    b.g.scale.setScalar(s);
  });

  for (const k of S.keys){
    if (k.revealUntil && now >= k.revealUntil){
      k.revealUntil = 0; k.viewed = true;
      k.mat.color.setHex(0x7d6440); k.mat.roughness = .5;
    }
    const showing = k.revealUntil > 0;
    k.teeth.visible = showing;
    const target = k.dead ? 0 : (showing ? 1.2 : 1);
    const s = k.g.scale.x + (target - k.g.scale.x) * .2;
    k.g.scale.setScalar(s);
    k.g.position.z += ((showing ? .18 : 0) - k.g.position.z) * .18;
    if (k.dead && s < .03) k.g.visible = false;
  }

  const tz = S.peeking ? CAM_P_NEAR : CAM_P_FAR;
  camP.position.z += (tz - camP.position.z) * .12;
  camP.lookAt(0, camP.userData.lookY ?? .128, 0);

  if (S.peeking && S.peekUntil){
    const left = Math.max(0, S.peekUntil - now);
    peekFill.style.transform = `scaleX(${left / CFG.peekMs})`;
    if (left <= 0) peekStop();
  }

  let sc, cm;
  if (S.phase === 'lock'){ sc = sceneL; cm = camP; }
  else if (S.phase === 'keys'){ sc = sceneK; cm = camK; }
  else { sc = sceneB; cm = camB; }

  if (composer){ rp.scene = sc; rp.camera = cm; composer.render(); }
  else renderer.render(sc, cm);

  requestAnimationFrame(tick);
}

newRound();
S.phase = 'title';
tick();
</script>
</body>
