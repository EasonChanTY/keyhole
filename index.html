<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="齿口">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0705">
<title>齿口 · Keyhole</title>
<style>
:root{--gold:#e6c47f;--ink:#efe6d6;--bg:#0a0705}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.55;transition:opacity .45s;
  background:radial-gradient(circle at 50% 46%,#0000 30%,#00000055 55%,#000000e8 82%)}
#vig.on{opacity:1}
#fade{position:fixed;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none;transition:opacity .3s ease}
#fade.on{opacity:1;pointer-events:auto}
#flash{position:fixed;inset:0;z-index:8;pointer-events:none;background:#fff;opacity:0;transition:opacity .16s ease}

#boot{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;background:#070504;transition:opacity .5s;color:var(--gold)}
#boot.off{opacity:0;pointer-events:none}
#boot .b1{font-size:15px;letter-spacing:.6em;text-indent:.6em;opacity:.85}
#boot .bar{width:90px;height:1px;background:#ffffff18;overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;background:var(--gold);animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

#hud{position:fixed;top:0;left:0;right:0;z-index:6;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top)) 16px 20px;
  background:linear-gradient(#000000d9,#0000);display:flex;flex-direction:column;gap:7px}
#hud .h1{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.12em;color:#8f8270}
#hud .h1 b{color:var(--gold);font-size:18px;font-weight:700;letter-spacing:0;margin-left:5px}
#hud .sp{flex:1}
#hud .h2{display:flex;align-items:center;gap:10px;font-size:10.5px;color:#7d7266;letter-spacing:.06em}
#hud button{pointer-events:auto;padding:7px 11px;border-radius:10px;border:1px solid #ffffff1c;
  background:#ffffff08;color:#a99c88;font-size:11.5px;font-family:inherit;flex:0 0 auto}
.oildot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#e6c47f;margin-right:3px}
.oildot.off{background:#3a322a}

#ui{position:fixed;left:0;right:0;bottom:0;z-index:6;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;background:linear-gradient(#0000,#000000eb 46%)}
.row{display:flex;gap:8px}
button{font-family:inherit;flex:1;padding:15px 6px;border-radius:14px;
  border:1px solid #ffffff1a;background:#171210e0;color:var(--ink);
  font-size:15px;font-weight:600;transition:transform .12s,opacity .25s;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
button:active{transform:scale(.972)}
button:disabled{opacity:.26}
button.gold{background:linear-gradient(#eccd85,#a8853c);color:#1c1206;border-color:#f6e2b4}
button.small{font-size:12.5px;padding:11px}
button.danger{background:#2a1411;color:#e2a390;border-color:#c0563a55;font-size:12.5px;padding:11px}
#btnR,#btnC{display:none}
#msg{text-align:center;font-size:12.5px;line-height:1.5;color:#a2957f;min-height:18px}

#peekBar{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:7;background:#ffffff12;display:none}
#peekBar i{display:block;height:100%;width:100%;transform-origin:left;
  background:linear-gradient(90deg,#e6c47f,#fff6dd)}

#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.94);
  z-index:9;padding:20px 26px;border-radius:20px;text-align:center;
  background:#0b0806f7;border:1px solid #ffffff1f;box-shadow:0 26px 80px #000d;
  opacity:0;transition:.26s cubic-bezier(.2,.9,.3,1.15);pointer-events:none;
  font-size:13px;line-height:1.65;color:#c0b4a0;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast b{display:block;font-size:23px;font-weight:700;color:var(--gold);margin:4px 0}

#stage{position:fixed;inset:0;z-index:7;display:none}
#stage.on{display:block}
#tapLayer{position:absolute;inset:0}
#stTop{position:absolute;top:calc(96px + env(safe-area-inset-top));left:0;right:0;
  display:flex;justify-content:space-between;padding:0 22px;font-size:11px;
  letter-spacing:.14em;color:#8f8270;pointer-events:none}
#stTop b{color:var(--gold);font-size:19px;letter-spacing:0;display:block;margin-top:3px}
#rar{position:absolute;left:50%;top:55%;transform:translate(-50%,8px) scale(.9);opacity:0;
  text-align:center;pointer-events:none;transition:.32s cubic-bezier(.2,1.5,.4,1)}
#rar.on{opacity:1;transform:translate(-50%,0) scale(1)}
#rar .q{font-size:11px;letter-spacing:.26em;display:inline-block;padding:4px 12px;
  border-radius:20px;color:#0d0906;font-weight:800}
#rar .n{font-size:20px;margin-top:8px;letter-spacing:.06em;color:#efe4d0}
#rar .v{font-size:15px;margin-top:3px;color:#e6c47f;transition:color .2s}
#rar .v.hit{color:#ff9a86}
#markLog{display:flex;flex-direction:column;gap:3px;margin-top:6px;align-items:center}
.mk{font-size:11px;letter-spacing:.06em;color:#ff9080;animation:cp .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cp{from{transform:scale(0)}to{transform:scale(1)}}
#chips{position:absolute;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 20px;pointer-events:none}
.chip{width:9px;height:9px;border-radius:3px}
#stHint{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));
  text-align:center;font-size:12.5px;color:#b7a88e;letter-spacing:.14em;
  animation:bt 1.6s ease-in-out infinite;pointer-events:none}
@keyframes bt{0%,100%{opacity:.45}50%{opacity:1}}
#stSum{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;background:#0a0705e8;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#stSum.on{display:flex}
#stSum .lbl{font-size:11px;letter-spacing:.4em;color:#8f8270}
#stSum .big{font-size:46px;color:var(--gold);font-weight:200}
#stSum .sub{font-size:12px;color:#9c8f7b;margin-bottom:12px;text-align:center;line-height:1.7}
#stSum button{width:210px;padding:16px;border-radius:16px;border:none;flex:0 0 auto;
  background:linear-gradient(#eccd85,#a8853c);color:#1c1206;font-size:15px;font-weight:700}

/* ===== 全屏面板（登录 / 背包 / 设置） ===== */
.panel{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;
  background:linear-gradient(#0c0906,#070504);
  padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.panel.on{display:flex}
.phead{display:flex;align-items:center;gap:10px;padding-bottom:12px;
  border-bottom:1px solid #ffffff12;margin-bottom:12px}
.phead h2{margin:0;font-size:15px;font-weight:500;letter-spacing:.2em;color:var(--gold)}
.phead .sp{flex:1}
.phead button{flex:0 0 auto;padding:8px 14px;font-size:12.5px;border-radius:10px;
  border:1px solid #ffffff1c;background:#ffffff08;color:#a99c88}

#login{display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(120% 75% at 50% 30%,#20160d 0%,#0a0705 62%,#040302 100%)}
#login.on{display:flex}
#login h1{margin:0;font-size:40px;font-weight:200;color:var(--gold);
  letter-spacing:.42em;text-indent:.42em}
#login .sub{font-size:11px;letter-spacing:.28em;color:#7a6a53;margin-top:14px}
#login input{margin-top:34px;width:230px;padding:14px 16px;border-radius:12px;
  border:1px solid #ffffff22;background:#ffffff08;color:var(--ink);
  font-size:15px;text-align:center;font-family:inherit;outline:none}
#login input::placeholder{color:#5f5548}
#login button{margin-top:16px;width:230px;flex:0 0 auto;padding:15px;border-radius:14px;
  border:none;background:linear-gradient(#eccd85,#a8853c);color:#1c1206;
  font-size:15px;font-weight:700;letter-spacing:.14em}
#login .tip{margin-top:26px;font-size:10.5px;color:#5f5548;text-align:center;line-height:1.9}

#bagList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:7px}
.brow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;
  background:#16121099;border:1px solid #ffffff10}
.brow:active{background:#221a1499}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.bn{flex:1;font-size:14px;color:#ddd2c0}
.bc{font-size:10.5px;color:#8f8270;flex:0 0 auto;letter-spacing:.05em}
.bc.bad{color:#e98a76}
.bp{font-size:13px;color:var(--gold);width:64px;text-align:right;flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.star{color:#ffcf5c;font-size:11px;width:12px;flex:0 0 auto}

#detail{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;
  background:#000000c4;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#detail.on{display:flex}
#detail .card{width:100%;background:#100c09;border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  border-top:1px solid #ffffff1a;animation:up .28s cubic-bezier(.2,1.2,.4,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#detail .dn{font-size:20px;color:#efe4d0;letter-spacing:.06em}
#detail .dt{font-size:11px;color:#7a6a53;margin-top:5px;letter-spacing:.14em}
#detail .dd{font-size:13px;color:#a89a86;line-height:1.85;margin:14px 0 16px;
  font-style:italic}
#detail .dprice{font-size:26px;color:var(--gold);font-weight:200;
  display:flex;align-items:baseline;gap:8px}
#detail .dprice small{font-size:11px;color:#7a6a53;letter-spacing:.1em}
#detail .drow{display:flex;gap:9px;margin-top:18px}

#setList{display:flex;flex-direction:column;gap:10px}
#setList .lab{font-size:11px;color:#7d7266;letter-spacing:.16em;margin:6px 0 2px}
.mrow{display:flex;gap:8px}
.mrow button{flex:1;padding:13px;font-size:13.5px;border-radius:12px;
  border:1px solid #ffffff1a;background:#171210;color:#a2957f}
.mrow button.on{background:linear-gradient(#eccd85,#a8853c);color:#1c1206;border-color:#f6e2b4}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vig"></div>
<div id="flash"></div>

<header id="hud">
  <div class="h1">
    <div>金币<b id="hCoins">260</b></div>
    <div class="sp"></div>
    <button id="btnBag">背包 <span id="bagCount">0</span></button>
    <button id="btnSet">⚙</button>
  </div>
  <div class="h2">
    <span id="hOil"></span>
    <span id="hEra"></span>
    <span class="sp"></span>
    <span id="hLeft"></span>
  </div>
</header>

<section id="ui">
  <div id="msg">点开一只箱子</div>
  <div class="row">
    <button id="btnA" class="small">…</button>
    <button id="btnR" class="small">重看这把 · 60 金</button>
  </div>
  <button id="btnB" class="gold">…</button>
  <button id="btnC" class="danger">暴力开</button>
</section>

<div id="peekBar"><i></i></div>
<div id="toast"></div>

<section id="stage">
  <div id="tapLayer"></div>
  <div id="stTop">
    <div>本箱合计<b id="stSumVal">0</b></div>
    <div style="text-align:right">第<b id="stIdx">0</b></div>
  </div>
  <div id="rar"><div class="q"></div><div class="n"></div><div class="v"></div><div id="markLog"></div></div>
  <div id="chips"></div>
  <div id="stHint">转 动 查 看</div>
  <div id="stSum">
    <div class="lbl">本 箱 估 价</div>
    <div class="big" id="sumBig">0</div>
    <div class="sub" id="sumSub"></div>
    <button id="btnTake">收 进 背 包</button>
  </div>
</section>

<!-- 登录 -->
<section id="login" class="panel">
  <h1>齿口</h1>
  <div class="sub">K E Y H O L E</div>
  <input id="nick" placeholder="你的名字" maxlength="12">
  <button id="btnLogin">进 入</button>
  <div class="tip">存档保存在这台设备上<br>（微信手机号登录需要服务器，暂未支持）</div>
</section>

<!-- 背包 -->
<section id="bagScreen" class="panel">
  <div class="phead">
    <h2>背 包</h2>
    <div class="sp"></div>
    <button id="bsClose">关闭</button>
  </div>
  <div class="h2" style="display:flex;gap:10px;font-size:10.5px;color:#7d7266;margin-bottom:10px">
    <span id="bsEra"></span><span id="bsEraDesc" style="color:#5f5548"></span>
  </div>
  <div id="bagList"></div>
  <div id="bagEmpty" style="text-align:center;color:#5f5548;font-size:12.5px;padding:40px 0;
    display:none">背包是空的 —— 去开箱吧</div>
</section>

<!-- 物品详情 -->
<div id="detail">
  <div class="card">
    <div class="dn" id="dName">—</div>
    <div class="dt" id="dMeta">—</div>
    <div class="dd" id="dDesc"></div>
    <div class="dprice" id="dPrice">0<small>当前市价</small></div>
    <div class="drow">
      <button id="dFav" class="small">收藏</button>
      <button id="dSell" class="gold">出售</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<section id="setScreen" class="panel">
  <div class="phead">
    <h2>设 置</h2>
    <div class="sp"></div>
    <button id="stClose">关闭</button>
  </div>
  <div id="setList">
    <div class="lab">难 度（下局生效）</div>
    <div class="mrow" id="modeRow">
      <button data-mode="easy">简单</button>
      <button data-mode="hard">困难</button>
      <button data-mode="nightmare">噩梦</button>
    </div>
    <div class="lab" style="margin-top:18px">存 档</div>
    <button id="btnReset" class="danger" style="flex:0 0 auto">清空存档、重新开始</button>
    <div style="font-size:10.5px;color:#4f463c;line-height:1.9;margin-top:22px">
      版本 v8 · 单机版<br>物品好坏在生成时已确定，转动只是验货。
    </div>
  </div>
</section>

<div id="fade"></div>
<div id="boot"><div class="b1">齿 口</div><div class="bar"><i></i></div></div>

<script>
window.addEventListener('error', e => err(e.message));
window.addEventListener('unhandledrejection', e => err((e.reason && e.reason.message) || e.reason));
function err(m){
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;z-index:99;background:#000;color:#ff9c9c;padding:24px;'+
    'font-size:12px;line-height:1.7;overflow:auto;white-space:pre-wrap">出错了：\n' + m + '</div>');
}
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

function hash(s){
  let h = 2166136261;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h>>>0)%100000)/100000;
}
const HOUR = 3600000;
const epoch = () => Math.floor(Date.now()/HOUR);
const ERAS = [
  {n:'收藏热',   m:{junk:.6,curio:1.0,antique:1.6,gem:1.3,relic:1.4}, d:'全城都在收老物件'},
  {n:'大萧条',   m:{junk:1.8,curio:.7,antique:.6,gem:.45,relic:.7},   d:'珠宝换不来一顿饱饭'},
  {n:'镀金年代', m:{junk:.8,curio:1.0,antique:1.1,gem:1.9,relic:1.2}, d:'人人都想戴点什么'},
  {n:'战乱',     m:{junk:2.2,curio:.9,antique:.5,gem:.35,relic:.6},   d:'一只空罐头也很值钱'},
  {n:'考古热',   m:{junk:.5,curio:1.1,antique:2.2,gem:1.0,relic:1.6}, d:'博物馆在到处收东西'},

];
function curEra(){
  const idx = Math.floor(hash('era'+Math.floor(epoch()/4))*ERAS.length);
  return ERAS[Math.min(idx, ERAS.length-1)];
}
function priceOf(item, cond){
  if (cond >= 5 || !item) return 0;
  const ep = epoch(), era = curEra();
  let f = 0.90 + hash(item.id+'|'+ep) * 0.20;      // 常时 ±10%
  const r = hash(item.id+'|r|'+ep);
  if (r < 0.012) f *= 3.4;                          // 极低概率暴涨
  else if (r < 0.030) f *= 0.35;                    // 极低概率暴跌
  const v = item.b * (era.m[item.c] || 1) * f * COND_MUL[cond];
  return Math.max(1, Math.round(v));
}

const ac=()=>{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume(); return AC; };
function tone(f,d,t='sine',v=.12,to=0){
  const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type=t;o.frequency.value=f;
  if(to) o.frequency.exponentialRampToValueAtTime(to,c.currentTime+d);
  g.gain.setValueAtTime(v,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.03);
}
function noise(d,v=.08,hp=1600){
  const c=ac(),b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate);
  const a=b.getChannelData(0);
  for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,3);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=c.createGain();g.gain.value=v;
  s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}

  const teeth=new THREE.Group();
  for(let i=0;i<n;i++){
    const L=segLen(code[i]);
    const t=new THREE.Mesh(new THREE.BoxGeometry(w,L,.024),mat);
    t.position.set(-.09+i*gap,.029-L/2,0);teeth.add(t);
  }
  g.add(teeth);
  const tip=new THREE.Mesh(new THREE.BoxGeometry(.055,.05,.024),mat);
  tip.position.set(.30,.02,0);g.add(tip);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  g.userData={teeth,mat};
  return g;
}

/* ================= 12. 箱子等级 ================= */
const TIERS=[
  {name:'木箱',metal:0x8a6a3a,price:18, n:[3,4],w:[.45,.32,.16,.07,.00],swan:.03,wt:.45},
  {name:'铜箱',metal:0xb87333,price:45, n:[4,5],w:[.32,.30,.24,.12,.02],swan:.05,wt:.32},
  {name:'银箱',metal:0xb9c3cc,price:90, n:[4,6],w:[.18,.28,.30,.18,.06],swan:.07,wt:.17},
  {name:'金箱',metal:0xd8b25c,price:180,n:[5,7],w:[.10,.28,.28,.24,.10],swan:.10,wt:.06}
];
function pickTier(){
  const r=Math.random();let acc=0;
  for(const t of TIERS){acc+=t.wt;if(r<acc)return t;}
  return TIERS[0];
}
function rollLoot(tier){
  const n=tier.n[0]+rnd(tier.n[1]-tier.n[0]+1);
  const out=[];
  for(let i=0;i<n;i++){
    const r=Math.random();let acc=0,t=1;
    for(let k=0;k<5;k++){acc+=tier.w[k];if(r<acc){t=k+1;break;}}
    const pool=POOL[t];
    out.push({item:pool[rnd(pool.length)],cond:rollCond(t)});
  }
  return out;
}
function rollCond(tier){
  if(tier<=1) return 1;
  const p=[0,0,.08,.25,.45,.62][tier];
  if(Math.random()>p) return 1;
  const r=Math.random();
  if(tier>=4&&r<.16) return 5;
  if(r<.5) return 2;
  if(r<.82) return 3;
  return 4;
}

/* ================= 13. 回合 ================= */
function clearGroup(root){
  while(root.children.length){
    const c=root.children[0];root.remove(c);
    c.traverse(o=>{if(o.geometry)o.geometry.dispose();});
  }
}
function newRound(){
  clearGroup(boxRoot);
  S.boxes=[];
  for(let i=0;i<CFG.boxCount;i++){
    const tier=pickTier();
    const loot=rollLoot(tier);
    const shown=loot.slice().sort((a,b)=>b.item.t-a.item.t).slice(0,Math.min(2,loot.length));
    const g=makeBox(tier,shown);
    g.position.set(0,1.46-i*0.73,0);
    boxRoot.add(g);
    g.traverse(o=>o.userData.boxIndex=i);
    S.boxes.push({tier,loot,shown,g,swan:Math.random()<tier.swan});
  }
  S.selBox=-1;S.selKey=-1;S.busy=false;
  S.phase='box';S.peeking=false;S.peeked=false;
  S.loot=[];S.drawIdx=-1;S.collected=0;S.summary=false;S.insp=null;
  vig.classList.remove('on');
  peekBar.style.display='none';
  stageEl.classList.remove('on');
  uiEl.style.display='flex';
  pins.forEach(p=>p.visible=false);
  datum.visible=false;
  layout();
  msg(`${MODE.name}模式 · ${MODE.teeth} 齿 · 点一只箱子`);
  updateUI();
}
function chooseBox(i){
  if(S.phase!=='box'||S.busy)return;
  S.selBox=i;SFX.tap();
  const b=S.boxes[i];
  msg(`${b.tier.name} · ${b.tier.price}金｜玻璃下：${b.shown.map(x=>x.item.n).join('、')}`);
  updateUI();
}
function confirmBox(){
  if(S.phase!=='box'||S.selBox<0)return;
  const b=S.boxes[S.selBox];
  if(S.coins<b.tier.price){toast('金币不够买这只箱子');return;}
  S.coins-=b.tier.price;save();
  const n=MODE.teeth;
  buildPins(n);buildObstruction(MODE.bars);
  S.lock=Array.from({length:n},()=>rnd(5));
  S.lock.forEach((c,i)=>{const L=segLen(c)*.95;pins[i].scale.y=L;pins[i].position.y=.16-L/2;});
  buildKeys(b.swan,n);
  S.busy=true;updateUI();
  fadeTo(()=>{
    S.phase='lock';S.peeking=false;S.peeked=false;S.busy=false;
    msg(`看清 ${n} 根锁芯 —— 只有 ${(MODE.peek/1000).toFixed(1)} 秒`);
    updateUI();
  });
}
function buildKeys(blackSwan,n){
  clearGroup(keysRoot);
  const codes=[];
  if(!blackSwan) codes.push(S.lock.slice());
  while(codes.length<MODE.keys){
    const c=Array.from({length:n},()=>rnd(5));
    if(codes.some(x=>same(x,c)))continue;
    codes.push(c);
  }
  for(let i=codes.length-1;i>0;i--){const j=rnd(i+1);[codes[i],codes[j]]=[codes[j],codes[i]];}
  const count=codes.length;
  const spacing=Math.min(.42,2.35/(count-1));
  const top=.66;
  S.keys=codes.map((code,i)=>{
    const g=makeKey(code);
    g.position.set(0,top-i*spacing,0);
    keysRoot.add(g);
    const obj={g,id:i,code,teeth:g.userData.teeth,mat:g.userData.mat,
               viewed:false,revealUntil:0,dead:false};
    g.traverse(o=>o.userData.keyRef=obj);
    return obj;
  });
  S.keysCenter=top-(count-1)*spacing/2;
  S.keysNeedH=(count-1)*spacing+0.46;
  layout();
}

function tapStage(){
  if(S.phase!=='reveal'||S.summary)return;

  if(insp&&insp.turn<1.6&&!insp.crumbled){
    toast('先转半圈 —— 没验过货不能收',1300);return;
  }
  if(insp){
    const price=insp.crumbled?0:insp.realPrice;

    if(!insp.crumbled||insp.cond>0){
      S.bag.push({id:insp.it.id,cond:insp.cond,fav:false,t:Date.now()});
    }

/* ================= 17. 买钥匙 / 暴力开 / 重看 ================= */
function afterOpen(b){
  S.opened++;
  S.oil=Math.min(CFG.oilMax,S.oil+1);
  save();updateUI();
  S.phase='opening';S.busy=true;
  uiEl.style.display='none';
  S.boxes.forEach((x,i)=>{x.g.visible=(i===S.selBox);});
  setTimeout(()=>{fadeTo(()=>startStage(b));},900);
}
function buyKey(){
  if(S.phase!=='keys'||S.busy||S.selKey<0)return;
  if(S.coins<CFG.price){toast('金币不够<b>本局结束</b>');return;}
  const k=S.keys[S.selKey],b=S.boxes[S.selBox];
  S.busy=true;S.coins-=CFG.price;S.selKey=-1;updateUI();save();
  const ok=same(k.code,S.lock);
  k.dead=true;
  setTimeout(()=>{
    if(ok){afterOpen(b);}
    else{
      SFX.wrong();
      const alive=S.keys.filter(x=>!x.dead).length;
      toast(alive===0?'五把钥匙都不对<b>锁被换过了</b>':'钥匙卡住了<b>齿口不对</b>这把废了',
            alive===0?2600:1900);
      S.busy=false;updateUI();
      msg('再挑一把 —— 箱子还在');
    }
  },280);
}
function bruteForce(){
  if(S.phase!=='keys'||S.busy)return;
  const b=S.boxes[S.selBox],c=bruteCost(b);
  if(S.coins<c){toast('金币不够暴力开');return;}
  S.coins-=c;S.busy=true;SFX.crack();
  const sorted=b.loot.slice().sort((x,y)=>priceOf(y.item,y.cond)-priceOf(x.item,x.cond));
  const best=sorted[0];
  if(best) b.loot=b.loot.filter(x=>x!==best);
  S.keys.forEach(k=>k.dead=true);
  updateUI();save();
  toast(best?`咔嚓 —— 锁断了<b>${best.item.n} 碎了</b>`:'咔嚓 —— 锁断了',2100);
  setTimeout(()=>afterOpen(b),1100);
}
function reviewKey(){
  if(S.phase!=='keys'||S.busy||S.selKey<0)return;
  if(S.coins<CFG.reviewCost){toast('金币不够重看');return;}
  const k=S.keys[S.selKey];
  if(k.dead){toast('这把已经废了');return;}
  S.coins-=CFG.reviewCost;
  k.viewed=false;k.revealUntil=performance.now()+CFG.viewMs;
  k.mat.color.setHex(0xd0a04c);k.mat.roughness=.24;
  SFX.lift();updateUI();save();
  toast('盯着看 —— 这次看清楚了',1400);
}

const ray=new THREE.Raycaster();
const pv=new THREE.Vector2();
function pickObj(ev,cam,root){
  pv.x=(ev.clientX/innerWidth)*2-1;
  pv.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(pv,cam);
  return ray.intersectObjects(root.children,true)[0];
}
renderer.domElement.addEventListener('pointerdown',ev=>{
  if(S.busy)return;
  if(S.phase==='box'){
    const hit=pickObj(ev,camB,boxRoot);
    if(hit&&hit.object.userData.boxIndex>=0)chooseBox(hit.object.userData.boxIndex);
  } else if(S.phase==='keys'){
    const hit=pickObj(ev,camK,keysRoot);
    if(hit&&hit.object.userData.keyRef){
      const k=hit.object.userData.keyRef;
      if(k.dead)return;
      S.selKey=k.id;
      S.keys.forEach(x=>x.mat.emissive.setHex(0));
      k.mat.emissive.setHex(0x261a06);
      if(!k.viewed&&k.revealUntil===0){
        k.revealUntil=performance.now()+CFG.viewMs;
        SFX.lift();msg('记住每个齿比脊线往下多长 —— 只能看这一次');
      } else {SFX.tap();msg('这把看过了 —— 想重看得花钱');}
      updateUI();
    }
  }
});
const tapLayer=$('tapLayer');
let dragging=false,lastX=0,moved=0;
tapLayer.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;moved=0;});
tapLayer.addEventListener('pointermove',e=>{
  if(!dragging||!S.insp)return;
  const dx=e.clientX-lastX;lastX=e.clientX;
  moved+=Math.abs(dx);
  S.insp.rotTarget+=dx*0.018;
});
tapLayer.addEventListener('pointerup',()=>{
  dragging=false;
  if(moved<14)tapStage();
});
tapLayer.addEventListener('pointercancel',()=>{dragging=false;});

/* ================= 20. 按钮 ================= */

/* ================= 22. 难度 ================= */
function paintModes(){
  const cur=MODE===MODES.easy?'easy':MODE===MODES.hard?'hard':'nightmare';
  [...document.querySelectorAll('#modeRow button')].forEach(b=>
    b.classList.toggle('on',b.dataset.mode===cur));
}
[...document.querySelectorAll('#modeRow button')].forEach(b=>{
  b.onclick=()=>{MODE=MODES[b.dataset.mode];SFX.tap();paintModes();
    toast(`难度已切换为 <b>${MODE.name}</b><br>下一局生效`,1600);};
});

/* ================= 23. 取景 ================= */
const hudEl=document.getElementById('hud');
function frameCam(cam,centerY,needH,needW,tIn,bIn){
  const W=innerWidth,H=innerHeight;
  const top=tIn!==undefined?tIn:Math.max(0,hudEl.getBoundingClientRect().bottom-6);
  const bottom=bIn!==undefined?bIn:Math.max(0,H-uiEl.getBoundingClientRect().top+6);
  const availH=Math.max(160,H-top-bottom);
  const tv=Math.tan(cam.fov*Math.PI/360);
  const dV=(needH/2)/(tv*availH/H);
  const dH=(needW/2)/(tv*cam.aspect);
  const d=Math.max(dV,dH);
  const visibleH=2*tv*d;
  const targetPx=top+availH/2;
  const shift=(H/2-targetPx)*visibleH/H;
  const ty=centerY-shift;
  cam.position.set(0,ty,d);
  cam.lookAt(0,ty,0);
}
function layout(){
  const W=innerWidth,H=innerHeight;
  renderer.setSize(W,H,false);
  if(composer)composer.setSize(W,H);
  camB.aspect=camK.aspect=camP.aspect=camR.aspect=W/H;
  camB.updateProjectionMatrix();camK.updateProjectionMatrix();
  camP.updateProjectionMatrix();camR.updateProjectionMatrix();
  frameCam(camB,0,3.60,1.55);
  frameCam(camK,S.keysCenter??-0.26,S.keysNeedH??2.36,1.02);
  frameCam(camR,0.02,0.92,0.92,150,250);
  const tv=Math.tan(camP.fov*Math.PI/360);
  const top=Math.max(0,hudEl.getBoundingClientRect().bottom-6);
  const bottom=Math.max(0,H-uiEl.getBoundingClientRect().top+6);
  const availH=Math.max(160,H-top-bottom);
  const visPeek=2*tv*CAM_P_NEAR;
  const shiftPx=H/2-(top+availH/2);
  const lookY=0.128-shiftPx*visPeek/H;
  camP.position.set(0,lookY,CAM_P_FAR);
  camP.lookAt(0,lookY,0);
  camP.userData.lookY=lookY;
}
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(layout,120);});

/* ================= 24. 后处理 ================= */
let composer=null,rp=null;
try{
  const [{EffectComposer},{RenderPass},{UnrealBloomPass},{OutputPass}]=await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js')
  ]);
  composer=new EffectComposer(renderer);
  rp=new RenderPass(sceneB,camB);
  composer.addPass(rp);
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.42,.72,.86));
  composer.addPass(new OutputPass());
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth,innerHeight);
}catch(e){composer=null;console.warn('bloom off',e);}

layout();

/* ================= 25. 主循环 ================= */
function tick(){
  const now=performance.now();

  S.boxes.forEach((b,i)=>{
    const sel=(S.phase==='box'&&i===S.selBox);
    b.g.position.z+=((sel?.55:0)-b.g.position.z)*.14;
    const s=b.g.scale.x+((sel?1.22:1)-b.g.scale.x)*.14;
    b.g.scale.setScalar(s);
  });

  if(S.phase==='opening'&&S.boxes[S.selBox]){
    const lid=S.boxes[S.selBox].g.userData.lid;
    lid.rotation.x+=(-1.15-lid.rotation.x)*.10;
  }

  const insp=S.insp;
  if(insp&&S.phase==='reveal'&&insp.obj){
    const t=Math.min(1,(now-insp.t0)/420);
    const e=1-Math.pow(1-t,3);
    if(!insp.crumbled)
      insp.obj.scale.setScalar(Math.max(.001,e*(1+.14*Math.sin(t*Math.PI))));
    insp.obj.position.y=.004+Math.sin(now*.0018)*.008;

    if(insp.spin>0.001){
      insp.rot+=insp.spin;insp.spin*=.94;
      insp.rotTarget=insp.rot;
    }
    const prev=insp.rot;
    insp.rot+=(insp.rotTarget-insp.rot)*.17;
    insp.turn+=Math.abs(insp.rot-prev);
    insp.obj.rotation.y=insp.rot;

    if(insp.turn>1.6&&!insp.unlocked){
      insp.unlocked=true;
      stHint.textContent='轻 点 收 下';
    }
    if(!insp.unlocked) stHint.textContent='转 动 查 看';

    for(const m of insp.marks){
      if(m.found)continue;
      let a=(m.angle+insp.rot)%(Math.PI*2);
      if(a<0)a+=Math.PI*2;
      const d=Math.min(a,Math.PI*2-a);
      if(d<0.50){m.found=true;if(m.mesh)m.mesh.visible=true;revealCond();}
    }
  }

  for(const k of S.keys){
    if(k.revealUntil&&now>=k.revealUntil){
      k.revealUntil=0;k.viewed=true;
      k.mat.color.setHex(0x7d6440);k.mat.roughness=.5;
    }
    const showing=k.revealUntil>0;
    k.teeth.visible=showing;
    const target=k.dead?0:(showing?1.2:1);
    const s=k.g.scale.x+(target-k.g.scale.x)*.2;
    k.g.scale.setScalar(s);
    k.g.position.z+=((showing?.18:0)-k.g.position.z)*.18;
    if(k.dead&&s<.03)k.g.visible=false;
  }

  const tz2=S.peeking?CAM_P_NEAR:CAM_P_FAR;
  camP.position.z+=(tz2-camP.position.z)*.12;
  camP.lookAt(0,camP.userData.lookY??.128,0);

  if(S.peeking&&S.peekUntil){
    const left=Math.max(0,S.peekUntil-now);
    peekFill.style.transform=`scaleX(${left/MODE.peek})`;
    if(left<=0)peekStop();
  }

  let sc,cm;
  if(S.phase==='lock'){sc=sceneL;cm=camP;}
  else if(S.phase==='keys'){sc=sceneK;cm=camK;}
  else if(S.phase==='reveal'){sc=sceneR;cm=camR;}
  else {sc=sceneB;cm=camB;}

  if(composer){rp.scene=sc;rp.camera=cm;composer.render();}
  else renderer.render(sc,cm);

  requestAnimationFrame(tick);
}

/* ================= 26. 启动 ================= */
buildPins(4);buildObstruction(0);

newRound();
S.phase='title';
uiEl.style.display='none';
if(hasSave){
  $('nick').value=S.nick;
  $('btnLogin').textContent='继 续';
}
$('login').classList.add('on');
tick();
setInterval(updateHud,30000);
setTimeout(()=>$('boot').classList.add('off'),500);
</script>
